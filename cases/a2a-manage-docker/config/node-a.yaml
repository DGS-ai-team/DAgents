# Node A — 合规助手（A2A 被调方）
agent_id: node-a

agent:
  name: 合规助手
  description: 内控与数据合规审查；接收其它 Agent 经 Manage 发起的合规咨询 A2A Task，依据内部规章制度给出 APPROVED/DENIED 结论。
  role: compliance
  capabilities:
    - compliance_review
    - policy_lookup
  metadata:
    department: 内控合规部
    consultation_prefix: "【合规咨询】"

listen:
  host: 0.0.0.0
  port: 18765

local:
  endpoint: http://node-a:18765

fs_root: /workspace/.runtime

llm:
  provider: openai
  base_url: ${LLM_API_BASE}
  model: ${LLM_MODEL}
  api_key_env: LLM_API_KEY
  mock: true

manage:
  enabled: true
  url: http://manage:8020
  registration:
    base_url: http://node-a:18765
    interval_seconds: 15
    ttl_seconds: 45
    team: a2a-lab
  a2a:
    inbox_wait_seconds: 5
    inbox_poll_seconds: 10

triggers:
  enabled: false

child_agents:
  enabled: false

log:
  level: info
