# Node B — 运维执行助手（A2A 调用方；本 case 由 verify 模拟发起咨询）
agent_id: node-b

listen:
  host: 0.0.0.0
  port: 18765

local:
  endpoint: http://node-b:18765

expose_to_peers: true

fs_root: /workspace/.runtime

llm:
  provider: openai
  base_url: ${LLM_API_BASE}
  model: ${LLM_MODEL}
  api_key_env: LLM_API_KEY
  mock: true
  max_tool_loops: 8

manage:
  enabled: true
  url: http://manage:8020
  registration:
    base_url: http://node-b:18765
    agent_card_path: /etc/dagents/agent-card.json
    interval_seconds: 15
    ttl_seconds: 45
    team: a2a-lab
  a2a:
    enabled: false

triggers:
  enabled: false

child_agents:
  enabled: false

log:
  level: info
