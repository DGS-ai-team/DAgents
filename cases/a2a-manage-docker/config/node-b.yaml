# Node B — 运维执行助手（A2A 调用方）
agent_id: node-b

agent:
  name: 运维执行助手
  description: 负责发布、数据导出与日常运维操作；在执行高风险动作前须向合规助手发起 A2A 合规咨询并等待 APPROVED。
  role: ops
  capabilities:
    - deployment
    - data_export
    - shell
  metadata:
    team: 平台运维

listen:
  host: 0.0.0.0
  port: 18765

local:
  endpoint: http://node-b:18765

fs_root: /workspace/.runtime

llm:
  provider: openai
  base_url: ${LLM_API_BASE}
  model: ${LLM_MODEL}
  api_key_env: LLM_API_KEY
  mock: true

manage:
  enabled: true
  url: http://manage:8020
  registration:
    base_url: http://node-b:18765
    interval_seconds: 15
    ttl_seconds: 45
    team: a2a-lab

triggers:
  enabled: false

child_agents:
  enabled: false

log:
  level: info
