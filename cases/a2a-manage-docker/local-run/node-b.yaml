agent_id: node-b

agent:
  name: 运维执行助手
  description: 负责发布、数据导出与日常运维；高风险操作前须向合规助手发起 A2A 咨询。
  role: ops
  compliance_peer: node-a
  capabilities:
    - deployment
    - data_export
    - shell
  metadata:
    team: 平台运维

listen:
  host: 127.0.0.1
  port: 18766

local:
  endpoint: http://127.0.0.1:18766

fs_root: ../../runtime/node-b

llm:
  provider: openai
  mock: true
  max_tool_loops: 8

manage:
  enabled: true
  url: http://127.0.0.1:8020
  registration:
    base_url: http://127.0.0.1:18766
    interval_seconds: 15
    ttl_seconds: 45
    team: a2a-lab

triggers:
  enabled: false

child_agents:
  enabled: false

log:
  level: info
