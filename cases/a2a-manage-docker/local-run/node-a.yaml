agent_id: node-a

agent:
  name: 合规助手
  description: 内控与数据合规审查；接收其它 Agent 经 Manage 发起的合规咨询 A2A Task。
  role: compliance
  capabilities:
    - compliance_review
    - policy_lookup
  metadata:
    department: 内控合规部
    consultation_prefix: "【合规咨询】"

listen:
  host: 127.0.0.1
  port: 18765

local:
  endpoint: http://127.0.0.1:18765

fs_root: ../../runtime/node-a

llm:
  provider: openai
  mock: true

manage:
  enabled: true
  url: http://127.0.0.1:8020
  registration:
    base_url: http://127.0.0.1:18765
    interval_seconds: 15
    ttl_seconds: 45
    team: a2a-lab
  a2a:
    inbox_wait_seconds: 5
    inbox_poll_seconds: 10

triggers:
  enabled: false

child_agents:
  enabled: false

log:
  level: info
