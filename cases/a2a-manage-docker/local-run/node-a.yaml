agent_id: node-a

listen:
  host: 127.0.0.1
  port: 18765

local:
  endpoint: http://127.0.0.1:18765

expose_to_peers: true

fs_root: ../../runtime/node-a

llm:
  provider: openai
  mock: true
  max_tool_loops: 8

manage:
  enabled: true
  url: http://127.0.0.1:8020
  registration:
    base_url: http://127.0.0.1:18765
    interval_seconds: 15
    ttl_seconds: 45
    team: a2a-lab
  a2a:
    enabled: true
    inbox_wait_seconds: 5
    inbox_poll_seconds: 10

triggers:
  enabled: false

child_agents:
  enabled: false

log:
  level: info
