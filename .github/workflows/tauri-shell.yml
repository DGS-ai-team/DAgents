name: Tauri Shell (Windows)

# 构建 desktop/tray-tauri → dist/dagents-shell.exe（安装包唯一 Shell）。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  TAURI_LINUX_CI_IMAGE: ghcr.io/dgs-ai-team/dagents-tauri-linux-ci:ubuntu24.04-v1

jobs:
  cargo-check-linux:
    name: cargo check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keep a bootstrap path for the first run, before the GHCR image has
      # been published by the main-branch image workflow.
      - name: Setup Rust (bootstrap fallback)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tray-tauri/src-tauri -> target

      - name: Run cargo test in prebuilt image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cargo"
          # The prebuilt image intentionally contains only the native Linux
          # libraries and cargo cache. Keep formatting on the host toolchain;
          # older cached images may not include the rustfmt component.
          cargo fmt --check --manifest-path desktop/tray-tauri/src-tauri/Cargo.toml
          image_available=false
          max_pull_attempts=6
          pull_retry_delay_seconds=20

          for ((attempt = 1; attempt <= max_pull_attempts; attempt++)); do
            echo "Pulling ${TAURI_LINUX_CI_IMAGE} (attempt ${attempt}/${max_pull_attempts})"
            if docker pull "${TAURI_LINUX_CI_IMAGE}"; then
              image_available=true
              break
            fi

            if (( attempt < max_pull_attempts )); then
              echo "Tauri Linux CI image is not available yet; retrying in ${pull_retry_delay_seconds}s."
              sleep "${pull_retry_delay_seconds}"
            fi
          done

          if [[ "${image_available}" == true ]]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --env CARGO_HOME=/cargo \
              --env RUSTUP_HOME=/opt/rustup \
              --env PATH=/opt/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              --env CARGO_TERM_COLOR=always \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              --volume "${HOME}/.cargo:/cargo" \
              --workdir /workspace/desktop/tray-tauri/src-tauri \
              "${TAURI_LINUX_CI_IMAGE}" \
              sh -c 'cargo test --locked'
          else
            echo "::warning::Tauri Linux CI image is unavailable after ${max_pull_attempts} attempts; using the bootstrap apt path."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev \
              librsvg2-dev \
              patchelf \
              libssl-dev
            cargo test --locked --manifest-path desktop/tray-tauri/src-tauri/Cargo.toml
          fi

  build-windows:
    name: Build dagents-shell (windows-amd64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/tray-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tray-tauri/src-tauri -> target

      - name: Build Tauri shell
        shell: bash
        run: |
          cargo fmt --check --manifest-path desktop/tray-tauri/src-tauri/Cargo.toml
          chmod +x scripts/ci/build_dagents_shell_tauri.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist" bash scripts/ci/build_dagents_shell_tauri.sh
          test -f dist/dagents-shell.exe
          test -f dist/dagents-shell-tauri.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dagents-shell-tauri-windows-amd64
          path: |
            dist/dagents-shell.exe
            dist/dagents-shell-tauri.exe
          if-no-files-found: error
