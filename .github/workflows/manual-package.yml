name: Manual Package Binary

# 手动打本地助手包 + Manage 离线包（与 tag Release 同矩阵，不上传 GitHub Release）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号后缀（写入 dagents-local-assistant-* / dagents-manage-bundle-{version}）"
        required: false
        default: "0.0.0-manual"
      skip_tests:
        description: "跳过构建前 Go/Python 单测（仅调试打包脚本时用）"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BROWSER_PYINSTALLER_ARGS: --onefile --name dagents-browser --paths browser-service --collect-submodules browser_use --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --hidden-import=dagents_browser --hidden-import=dagents_browser.main --hidden-import=dagents_browser.server --hidden-import=dagents_browser.driver --hidden-import=dagents_browser.action_runner --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on browser-service/run_dagents_browser.py

jobs:
  test:
    name: Pre-build tests (Go + Python + Web UI)
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            manage/console/frontend/package-lock.json

      - name: Test Web UI
        run: |
          npm ci --prefix node/webui/frontend
          npm test --prefix node/webui/frontend

      - name: Build Web UI
        run: bash node/webui/build.sh

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum

      - name: Go test
        run: |
          go test ./shared/config/...
          go test ./node/...
          go test ./client/...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Python test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -p "test_*.py" -v

  build-local-assistant:
    name: Build local assistant (${{ matrix.platform }})
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            py_build: docker-rocky8
          - platform: windows-amd64
            os: windows-2022
            goos: windows
            goarch: amd64
            py_build: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            desktop/tray-tauri/package-lock.json
            packaging/bootstrapper/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum

      - name: Build Go binaries (dagents-node + dagents-client)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist/go-build-${{ matrix.platform }}"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            bash scripts/ci/build_go_static.sh
          EXE=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then EXE=".exe"; fi
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node${EXE}" "dist/dagents-node${EXE}"
          cp "${OUT_DIR}/bin/dagents-client${EXE}" "dist/dagents-client${EXE}"

      - name: Build dagents-shell (Windows)
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          chmod +x scripts/ci/build_dagents_shell.sh
          bash scripts/ci/build_dagents_shell.sh

      - name: Setup Rust (Windows Tauri shell)
        if: matrix.platform == 'windows-amd64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache (Tauri shell + Setup)
        if: matrix.platform == 'windows-amd64'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/tray-tauri/src-tauri -> target
            packaging/bootstrapper/src-tauri -> target
          shared-key: manual-tauri-win

      - name: Build dagents-shell-tauri (Windows, preview)
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          chmod +x scripts/ci/build_dagents_shell_tauri.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist" bash scripts/ci/build_dagents_shell_tauri.sh
          test -f dist/dagents-shell-tauri.exe

      - name: Setup Python (Windows)
        if: matrix.py_build == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build dagents-browser (Windows native PyInstaller)
        if: matrix.py_build == 'native'
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
        run: |
          bash scripts/ci/build_dagents_browser.sh

      - name: Build dagents-browser (Linux Rocky 8 Docker + pyenv, glibc 2.28)
        if: matrix.py_build == 'docker-rocky8'
        timeout-minutes: 120
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
          PYENV_PYTHON_VERSION: "3.13.2"
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e BROWSER_PI_ARGS -e PYENV_PYTHON_VERSION \
            rockylinux:8 \
            bash /src/scripts/ci/build_linux_rocky8_pyenv.sh

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PLATFORM="${{ matrix.platform }}" VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Install Inno Setup (Windows installer)
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (Inno)
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION}" bash scripts/ci/build_windows_installer.sh
          ls -la dist-installer dist/dagents-local-assistant-windows-amd64-installer-*.exe

      - name: Build Windows Setup wizard (portable Tauri, embeds Inno)
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          chmod +x scripts/ci/build_windows_setup_bootstrapper.sh
          VERSION="${VERSION}" bash scripts/ci/build_windows_setup_bootstrapper.sh
          ls -la dist/dagents-setup-windows-amd64-*.exe

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dagents-local-assistant-${{ matrix.platform }}
          path: dist/dagents-local-assistant-${{ matrix.platform }}-*.*
          if-no-files-found: error

      - name: Upload Windows installer (Inno)
        if: matrix.platform == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: dagents-windows-installer
          path: dist/dagents-local-assistant-windows-amd64-installer-*.exe
          if-no-files-found: error

      - name: Upload Windows Setup wizard (Tauri)
        if: matrix.platform == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: dagents-windows-setup
          path: dist/dagents-setup-windows-amd64-*.exe
          if-no-files-found: error

      - name: Upload Tauri shell preview (Windows)
        if: matrix.platform == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: dagents-shell-tauri-windows-amd64
          path: dist/dagents-shell-tauri.exe
          if-no-files-found: error

  build-manage-docker:
    name: Build Manage offline bundle
    needs: build-local-assistant
    # 与 Release 一致：依赖 linux-amd64 助手包 artifact 一并打进 Manage 离线包。
    if: ${{ always() && needs.build-local-assistant.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux-amd64 local assistant
        uses: actions/download-artifact@v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist

      - name: Build Manage offline bundle
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          chmod +x scripts/ci/build_manage_docker.sh scripts/ci/assemble_manage_bundle.sh
          VERSION="${VERSION}" bash scripts/ci/assemble_manage_bundle.sh
          ls -la dist/dagents-manage-bundle-*

      - name: Upload Manage offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: dagents-manage-bundle
          path: dist/dagents-manage-bundle-*.tar.gz
          if-no-files-found: error
