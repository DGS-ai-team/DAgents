name: Manual Package Binary

# 手动打本地助手包 + Manage 离线包（与 tag Release 同矩阵拆分，不上传 GitHub Release）。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "产物版本号后缀（写入 dagents-local-assistant-* / dagents-manage-bundle-{version}）"
        required: true
      skip_tests:
        description: "跳过构建前 Go/Python 单测（仅调试打包脚本时用）"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # docker/build-push-action cache-to type=gha

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PACKAGE_VERSION: ${{ inputs.version }}
  PYENV_PYTHON_VERSION: "3.13.2"
  BROWSER_PYINSTALLER_ARGS: --onefile --name dagents-browser --paths browser-service --collect-submodules browser_use --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --hidden-import=dagents_browser --hidden-import=dagents_browser.main --hidden-import=dagents_browser.server --hidden-import=dagents_browser.driver --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on browser-service/run_dagents_browser.py

jobs:
  validate-version:
    name: Validate package version
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        shell: bash
        run: |
          set -euo pipefail
          version="${PACKAGE_VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: ${version}; expected SemVer" >&2
            exit 1
          fi

  test:
    name: Pre-build tests (Go + Python + Web UI)
    needs: validate-version
    if: ${{ !inputs.skip_tests && needs.validate-version.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            manage/console/frontend/package-lock.json

      - name: Test Web UI
        run: |
          npm ci --prefix node/webui/frontend
          npm test --prefix node/webui/frontend

      - name: Lint Web UI
        run: npm run lint --prefix node/webui/frontend

      - name: Build Web UI
        run: bash node/webui/build.sh

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Lint Manage Console
        run: npm run lint --prefix manage/console/frontend

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Go test
        run: |
          go test ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...
          go vet ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...
          bash scripts/ci/run_staticcheck.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Python test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          python -m ruff check manage scripts tests
          python -m pyright --project pyrightconfig.json
          python -m unittest discover -s tests -p "test_*.py" -v

  build-linux-assistant:
    name: Build local assistant (linux-amd64)
    needs:
      - validate-version
      - test
    if: ${{ always() && needs.validate-version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Build Go binaries (dagents-node + dagents-client)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist/go-build-linux-amd64"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS=linux GOARCH=amd64 \
            bash scripts/ci/build_go_static.sh
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node" dist/dagents-node
          cp "${OUT_DIR}/bin/dagents-client" dist/dagents-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Rocky8 browser builder image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/ci/Dockerfile.rocky8-browser
          load: true
          tags: dagents-rocky8-browser:ci
          cache-from: type=gha,scope=rocky8-browser-builder
          cache-to: type=gha,mode=max,scope=rocky8-browser-builder

      - name: Cache Rocky8 pyenv (CPython)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/rocky8-pyenv
          key: rocky8-pyenv-${{ env.PYENV_PYTHON_VERSION }}-${{ hashFiles('browser-service/requirements.lock', 'requirements.lock') }}
          restore-keys: |
            rocky8-pyenv-${{ env.PYENV_PYTHON_VERSION }}-

      - name: Build dagents-browser (Rocky8 + cached pyenv)
        timeout-minutes: 120
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
        run: |
          set -euxo pipefail
          mkdir -p .cache/rocky8-pyenv
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -v "${GITHUB_WORKSPACE}/.cache/rocky8-pyenv:/opt/pyenv" \
            -e BROWSER_PI_ARGS \
            -e PYENV_PYTHON_VERSION \
            -e SKIP_DNF=1 \
            dagents-rocky8-browser:ci \
            bash /src/scripts/ci/build_linux_rocky8_pyenv.sh

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${PACKAGE_VERSION}"
          PLATFORM=linux-amd64 VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist/dagents-local-assistant-linux-amd64-*.*
          if-no-files-found: error

  build-windows-go:
    name: Build Windows Go binaries
    needs:
      - validate-version
      - test
    if: ${{ always() && needs.validate-version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Build Go binaries
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/dist/go-build-windows-amd64"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS=windows GOARCH=amd64 \
            bash scripts/ci/build_go_static.sh
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node.exe" dist/dagents-node.exe
          cp "${OUT_DIR}/bin/dagents-client.exe" dist/dagents-client.exe

      - name: Upload Go binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-win-go
          path: |
            dist/dagents-node.exe
            dist/dagents-client.exe
          if-no-files-found: error

  build-windows-shell:
    name: Build Windows shell (Tauri + legacy)
    needs:
      - validate-version
      - test
    if: ${{ always() && needs.validate-version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/tray-tauri/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache (Tauri tray shell)
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            desktop/tray-tauri/src-tauri -> target
          shared-key: manual-tauri-win

      - name: Build dagents-shell (Tauri + Go legacy)
        shell: bash
        run: |
          cargo fmt --check --manifest-path desktop/tray-tauri/src-tauri/Cargo.toml
          chmod +x scripts/ci/build_dagents_shell_tauri.sh scripts/ci/build_dagents_shell.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist" bash scripts/ci/build_dagents_shell_tauri.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist" bash scripts/ci/build_dagents_shell.sh
          test -f dist/dagents-shell-tauri.exe
          test -f dist/dagents-shell-legacy.exe
          test -f dist/dagents-shell.exe

      - name: Upload shell binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-win-shell
          path: |
            dist/dagents-shell.exe
            dist/dagents-shell-tauri.exe
            dist/dagents-shell-legacy.exe
          if-no-files-found: error

  build-windows-browser:
    name: Build Windows browser (PyInstaller)
    needs:
      - validate-version
      - test
    if: ${{ always() && needs.validate-version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build dagents-browser
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
        run: bash scripts/ci/build_dagents_browser.sh

      - name: Upload browser binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-win-browser
          path: dist/dagents-browser.exe
          if-no-files-found: error

  build-windows-assistant:
    name: Assemble Windows assistant + installer
    needs:
      - build-windows-go
      - build-windows-shell
      - build-windows-browser
    if: ${{ always() && needs.build-windows-go.result == 'success' && needs.build-windows-shell.result == 'success' && needs.build-windows-browser.result == 'success' }}
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Go binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-go
          path: dist

      - name: Download shell binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-shell
          path: dist

      - name: Download browser binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-browser
          path: dist

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${PACKAGE_VERSION}"
          PLATFORM=windows-amd64 VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (Inno)
        shell: bash
        run: |
          VERSION="${PACKAGE_VERSION}"
          VERSION="${VERSION}" bash scripts/ci/build_windows_installer.sh
          ls -la dist-installer dist/dagents-local-assistant-windows-amd64-installer-*.exe

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-local-assistant-windows-amd64
          path: dist/dagents-local-assistant-windows-amd64-*.*
          if-no-files-found: error

      - name: Upload Windows installer (Inno)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-windows-installer
          path: dist/dagents-local-assistant-windows-amd64-installer-*.exe
          if-no-files-found: error

  build-manage-docker:
    name: Build Manage offline bundle
    needs: build-linux-assistant
    if: ${{ always() && needs.build-linux-assistant.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download linux-amd64 local assistant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist

      - name: Build Manage offline bundle
        shell: bash
        run: |
          VERSION="${PACKAGE_VERSION}"
          chmod +x scripts/ci/build_manage_docker.sh scripts/ci/assemble_manage_bundle.sh
          VERSION="${VERSION}" bash scripts/ci/assemble_manage_bundle.sh
          ls -la dist/dagents-manage-bundle-*

      - name: Upload Manage offline bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-manage-bundle
          path: dist/dagents-manage-bundle-*.tar.gz
          if-no-files-found: error
