name: Manual Package Binary

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-bundle:
    name: Build Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            build_kind: native
            python_arch: x64
            archive_name: dagents-api-linux-x64.zip
            api_bin_name: dagents-api
            rc_bin_name: dagents-register-center
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents-register-center --hidden-import=httpx --hidden-import=fastapi --add-data=register-center:register-center run_register_center.py
          - target: linux-x86
            os: ubuntu-22.04
            build_kind: docker-i386
            python_arch: x86
            archive_name: dagents-api-linux-x86.zip
            api_bin_name: dagents-api
            rc_bin_name: dagents-register-center
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents-register-center --hidden-import=httpx --hidden-import=fastapi --add-data=register-center:register-center run_register_center.py
          - target: windows-x64
            os: windows-2022
            build_kind: native
            python_arch: x64
            archive_name: dagents-api-windows-x64.zip
            api_bin_name: dagents-api.exe
            rc_bin_name: dagents-register-center.exe
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents-register-center --hidden-import=httpx --hidden-import=fastapi --add-data="register-center;register-center" run_register_center.py
          - target: windows-x86
            os: windows-2022
            build_kind: native
            python_arch: x86
            archive_name: dagents-api-windows-x86.zip
            api_bin_name: dagents-api.exe
            rc_bin_name: dagents-register-center.exe
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents-register-center --hidden-import=httpx --hidden-import=fastapi --add-data="register-center;register-center" run_register_center.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo matrix (OS / 位数 / 构建方式)
        shell: bash
        run: |
          echo "target=${{ matrix.target }} build_kind=${{ matrix.build_kind }} python_arch=${{ matrix.python_arch }}"

      - name: Set up QEMU (Docker linux/386)
        if: matrix.build_kind == 'docker-i386'
        uses: docker/setup-qemu-action@v3

      - name: Setup Python (目标架构：x64 / x86)
        if: matrix.build_kind == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Install dependencies (Python packages, native build only)
        if: matrix.build_kind == 'native'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file binaries (native PyInstaller)
        if: matrix.build_kind == 'native'
        shell: bash
        run: |
          pyinstaller ${{ matrix.api_pyinstaller_args }}
          pyinstaller ${{ matrix.rc_pyinstaller_args }}

      - name: Build single-file binaries (Linux i386 / x86 via Docker)
        if: matrix.build_kind == 'docker-i386'
        shell: bash
        env:
          API_PI_ARGS: ${{ matrix.api_pyinstaller_args }}
          RC_PI_ARGS: ${{ matrix.rc_pyinstaller_args }}
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/386 \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e API_PI_ARGS -e RC_PI_ARGS \
            ubuntu:22.04 \
            bash -lc '
              set -euxo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-pip build-essential zlib1g-dev
              cd /src
              python3 -m pip install --upgrade pip
              python3 -m pip install -r requirements.txt pyinstaller
              eval python3 -m PyInstaller ${API_PI_ARGS}
              eval python3 -m PyInstaller ${RC_PI_ARGS}
            '

      - name: Prepare runtime bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bundle
          cp "dist/${{ matrix.api_bin_name }}" bundle/
          cp "dist/${{ matrix.rc_bin_name }}" bundle/
          cp startup_scripts/linux/start.sh bundle/
          cp startup_scripts/linux/start-register-center.sh bundle/
          chmod +x bundle/start.sh
          chmod +x bundle/start-register-center.sh
          cp .env.example bundle/
          cp README.md bundle/
          cp -r skills bundle/skills
          cp -r prompt_context bundle/prompt_context
          cd bundle
          zip -r "../${{ matrix.archive_name }}" .

      - name: Prepare runtime bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item "dist/${{ matrix.api_bin_name }}" "bundle/"
          Copy-Item "dist/${{ matrix.rc_bin_name }}" "bundle/"
          Copy-Item "startup_scripts/windows/start.bat" "bundle/"
          Copy-Item "startup_scripts/windows/start-register-center.bat" "bundle/"
          Copy-Item ".env.example" "bundle/"
          Copy-Item "README.md" "bundle/"
          Copy-Item "skills" "bundle/skills" -Recurse
          Copy-Item "prompt_context" "bundle/prompt_context" -Recurse
          Compress-Archive -Path bundle/* -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error
