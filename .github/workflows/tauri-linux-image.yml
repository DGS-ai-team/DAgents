name: Publish Tauri Linux CI image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - packaging/ci/Dockerfile.tauri-linux
      - .github/workflows/tauri-linux-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAURI_LINUX_CI_IMAGE: ghcr.io/dgs-ai-team/dagents-tauri-linux-ci:ubuntu24.04-v1

jobs:
  publish:
    name: Publish Tauri Linux CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/ci/Dockerfile.tauri-linux
          push: true
          tags: ${{ env.TAURI_LINUX_CI_IMAGE }}
          cache-from: type=gha,scope=tauri-linux-ci
          cache-to: type=gha,mode=max,scope=tauri-linux-ci
