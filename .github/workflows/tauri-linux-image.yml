name: Publish Tauri Linux CI image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - packaging/ci/Dockerfile.tauri-linux
      - .github/workflows/tauri-linux-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TAURI_LINUX_CI_IMAGE: ghcr.io/dgs-ai-team/dagents-tauri-linux-ci:ubuntu24.04-v1

jobs:
  publish:
    name: Publish Tauri Linux CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/ci/Dockerfile.tauri-linux
          push: true
          tags: ${{ env.TAURI_LINUX_CI_IMAGE }}
          cache-from: type=gha,scope=tauri-linux-ci
          cache-to: type=gha,mode=max,scope=tauri-linux-ci
