name: PR Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    name: Unit tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            manage/console/frontend/package-lock.json
            desktop/tray-tauri/package-lock.json

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Lint Manage Console
        run: npm run lint --prefix manage/console/frontend

      - name: Audit frontend dependencies
        run: |
          npm ci --prefix node/webui/frontend
          npm ci --prefix desktop/tray-tauri
          audit_frontend() {
            local package_dir="$1"
            local attempt output status
            for attempt in 1 2 3; do
              set +e
              output=$(npm audit --audit-level=high --prefix "$package_dir" 2>&1)
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if ! printf '%s\n' "$output" | grep -Eiq \
                '(503|504|service unavailable|EAI_AGAIN|ECONNRESET|ETIMEDOUT|ENETUNREACH|socket hang up|fetch failed)'; then
                return "$status"
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Transient npm audit failure for $package_dir; retrying ($((attempt + 1))/3)..."
                sleep $((attempt * 10))
              fi
            done
            return "$status"
          }
          audit_frontend node/webui/frontend
          audit_frontend manage/console/frontend
          audit_frontend desktop/tray-tauri

      - name: Check third-party license policy
        run: python scripts/ci/check_npm_license_policy.py

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # 与 `.github/workflows/build-and-release.yml` 保持一致
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock
          # browser-use 0.13.8 pins these exact versions. Keep the known
          # upstream-blocked findings explicit; any new finding still fails.
          # The lock includes Windows-only packages (for PyInstaller). Audit
          # the pinned records without resolving a Linux virtualenv.
          # browser-use 0.13.8 pins pypdf==6.14.2; these CVEs are blocked
          # upstream until browser-use publishes a compatible dependency.
          pip-audit --no-deps -r browser-service/requirements.lock \
            --ignore-vuln PYSEC-2026-2132 \
            --ignore-vuln PYSEC-2026-3481 \
            --ignore-vuln PYSEC-2026-3482 \
            --ignore-vuln PYSEC-2026-3483 \
            --ignore-vuln PYSEC-2026-3655 \
            --ignore-vuln PYSEC-2026-3656 \
            --ignore-vuln CVE-2026-82398 \
            --ignore-vuln CVE-2026-84309 \
            --ignore-vuln CVE-2026-84310 \
            --ignore-vuln CVE-2026-84311

      - name: Ruff
        run: python -m ruff check manage scripts tests

      - name: Pyright
        run: python -m pyright --project pyrightconfig.json

      - name: Run unittest discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v
