name: PR Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit:
    name: Unit tests (unittest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: manage/console/frontend/package-lock.json

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 与 `.github/workflows/build-and-release.yml` 保持一致
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unittest discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v
