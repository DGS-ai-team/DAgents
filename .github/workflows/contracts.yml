name: Contracts

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: API and fixture contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --requirement requirements.lock

      - name: Validate API and fixture contracts
        run: python scripts/ci/check_contracts.py

      - name: Verify OpenAPI route coverage is current
        run: python scripts/ci/sync_openapi_routes.py --check
