name: Manual Live LLM Smoke Test

# 通过「真实」LLM HTTP 接口做一次最小 chat 调用；需配置仓库 Secret，不适合在 PR 上默认开启。
on:
  workflow_dispatch:
    inputs:
      llm_api_base:
        description: "可选。覆盖 LLM_API_BASE（如 https://api.openai.com/v1 或兼容网关）。留空则使用仓库/环境已有配置或 Settings 默认。"
        required: false
        default: ""
      llm_model:
        description: "可选。覆盖 LLM_MODEL；留空则使用环境变量或 Settings 默认。"
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  live-llm:
    name: Live LLM smoke (optional overrides)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Require LLM_API_KEY secret
        env:
          KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::未配置仓库 Secret：LLM_API_KEY。请在 Settings → Secrets and variables → Actions 中添加。"
            exit 1
          fi

      - name: Run live LLM unittest
        env:
          RUN_LIVE_LLM_TESTS: "1"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          # 仅非空时导出，避免 workflow 输入的空串覆盖仓库/Organization 级 Variables。
          BASE="${{ inputs.llm_api_base }}"
          MODEL="${{ inputs.llm_model }}"
          [ -n "$BASE" ] && export LLM_API_BASE="$BASE"
          [ -n "$MODEL" ] && export LLM_MODEL="$MODEL"
          python -m unittest tests.integration.test_llm_live -v
