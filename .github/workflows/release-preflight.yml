name: Release metadata preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release metadata
        run: python scripts/release/validate_release.py
