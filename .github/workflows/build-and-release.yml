name: Build And Release Binary

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests (stable subset)
        run: |
          python -m unittest tests.test_agent_service tests.test_message_queue -v

      - name: Build single-file binary
        run: |
          pyinstaller --onefile --name dagents-api run_agent_api.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dagents-api-linux
          path: dist/dagents-api
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dagents-api-linux
          path: dist

      - name: Create release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dagents-api
          generate_release_notes: true
