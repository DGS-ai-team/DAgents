name: Build And Release Binary

# 仅在 v* 标签上构建本地助手包（Go Node + Web UI）并创建 GitHub Release。
# dev/main 的提交检查由 ci-required.yml 负责，避免 main push 与 tag 重复跑单测。
#
# 发版墙钟优化（相对旧矩阵串行）：
# - Linux / Windows(Go+Shell+Browser) 与单测后并行；Manage 只等 linux 包
# - Windows：Go / Tauri Shell / browser 三路并行后再 assemble+Inno
# - Linux browser：Rocky8 预装依赖镜像 + pyenv 目录 GHA cache
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write  # docker/build-push-action cache-to type=gha

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYENV_PYTHON_VERSION: "3.13.2"
  BROWSER_PYINSTALLER_ARGS: --onefile --name dagents-browser --paths browser-service --collect-submodules browser_use --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --hidden-import=dagents_browser --hidden-import=dagents_browser.main --hidden-import=dagents_browser.server --hidden-import=dagents_browser.driver --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on browser-service/run_dagents_browser.py

jobs:
  validate-release:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag source and version metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}; expected vX.Y.Z or a SemVer prerelease" >&2
            exit 1
          fi
          if [[ "${{ github.event.forced }}" == "true" ]]; then
            echo "Release tags must never be force-updated" >&2
            exit 1
          fi

          git fetch --no-tags origin main --depth=1
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must point to the current origin/main commit" >&2
            echo "tag=$(git rev-parse HEAD) main=$(git rev-parse FETCH_HEAD)" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Validate release metadata
        run: python scripts/release/validate_release.py --version "${GITHUB_REF_NAME#v}"

  unit-tests:
    name: Unit tests (Go + Python + Web UI)
    needs: validate-release
    if: ${{ needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            manage/console/frontend/package-lock.json

      - name: Test Web UI
        run: |
          npm ci --prefix node/webui/frontend
          npm test --prefix node/webui/frontend

      - name: Lint Web UI
        run: npm run lint --prefix node/webui/frontend

      - name: Build Web UI
        run: bash node/webui/build.sh

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Lint Manage Console
        run: npm run lint --prefix manage/console/frontend

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Go test
        run: |
          go test ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...
          go vet ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...
          bash scripts/ci/run_staticcheck.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check manage scripts tests

      - name: Pyright
        run: python -m pyright --project pyrightconfig.json

      - name: Python unittest
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-linux-assistant:
    name: Build local assistant (linux-amd64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Build Go binaries (dagents-node + dagents-client)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist/go-build-linux-amd64"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS=linux GOARCH=amd64 \
            bash scripts/ci/build_go_static.sh
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node" dist/dagents-node
          cp "${OUT_DIR}/bin/dagents-client" dist/dagents-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Rocky8 browser builder image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/ci/Dockerfile.rocky8-browser
          load: true
          tags: dagents-rocky8-browser:ci
          cache-from: type=gha,scope=rocky8-browser-builder
          cache-to: type=gha,mode=max,scope=rocky8-browser-builder

      - name: Cache Rocky8 pyenv (CPython)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/rocky8-pyenv
          key: rocky8-pyenv-${{ env.PYENV_PYTHON_VERSION }}-${{ hashFiles('browser-service/requirements.lock', 'requirements.lock') }}
          restore-keys: |
            rocky8-pyenv-${{ env.PYENV_PYTHON_VERSION }}-

      - name: Build dagents-browser (Rocky8 + cached pyenv)
        timeout-minutes: 120
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
        run: |
          set -euxo pipefail
          mkdir -p .cache/rocky8-pyenv
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -v "${GITHUB_WORKSPACE}/.cache/rocky8-pyenv:/opt/pyenv" \
            -e BROWSER_PI_ARGS \
            -e PYENV_PYTHON_VERSION \
            -e SKIP_DNF=1 \
            dagents-rocky8-browser:ci \
            bash /src/scripts/ci/build_linux_rocky8_pyenv.sh

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM=linux-amd64 VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist/dagents-local-assistant-linux-amd64-*.*
          if-no-files-found: error

  build-windows-go:
    name: Build Windows Go binaries (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            platform: windows-amd64
            goarch: amd64
          - label: x86
            platform: windows-386
            goarch: '386'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Build Go binaries
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/dist/${{ matrix.platform }}"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS=windows GOARCH=${{ matrix.goarch }} \
            bash scripts/ci/build_go_static.sh
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node.exe" "dist/${{ matrix.platform }}/dagents-node.exe"
          cp "${OUT_DIR}/bin/dagents-client.exe" "dist/${{ matrix.platform }}/dagents-client.exe"

      - name: Upload Go binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-win-go-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error

  build-windows-shell:
    name: Build Windows shell (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            platform: windows-amd64
            goarch: amd64
            tauri_target: x86_64-pc-windows-msvc
          - label: x86
            platform: windows-386
            goarch: '386'
            tauri_target: i686-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/tray-tauri/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.tauri_target }}

      - name: Rust cache (Tauri tray shell)
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            desktop/tray-tauri/src-tauri -> target
          shared-key: release-tauri-win

      - name: Build dagents-shell (Tauri + Go legacy)
        shell: bash
        run: |
          cargo fmt --check --manifest-path desktop/tray-tauri/src-tauri/Cargo.toml
          chmod +x scripts/ci/build_dagents_shell_tauri.sh scripts/ci/build_dagents_shell.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist/${{ matrix.platform }}" \
            TAURI_TARGET="${{ matrix.tauri_target }}" \
            bash scripts/ci/build_dagents_shell_tauri.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist/${{ matrix.platform }}" \
            GOOS=windows GOARCH=${{ matrix.goarch }} \
            bash scripts/ci/build_dagents_shell.sh
          test -f "dist/${{ matrix.platform }}/dagents-shell-tauri.exe"
          test -f "dist/${{ matrix.platform }}/dagents-shell-legacy.exe"
          test -f "dist/${{ matrix.platform }}/dagents-shell.exe"

      - name: Upload shell binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-win-shell-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error

  build-windows-browser:
    name: Build Windows browser (${{ matrix.label }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            platform: windows-amd64
            python_arch: x64
          - label: x86
            platform: windows-386
            python_arch: x86
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Build dagents-browser
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
          BROWSER_CRYPTOGRAPHY_VERSION: ${{ matrix.python_arch == 'x86' && '48.0.1' || '' }}
        run: |
          bash scripts/ci/build_dagents_browser.sh
          mkdir -p "dist/${{ matrix.platform }}"
          cp dist/dagents-browser.exe "dist/${{ matrix.platform }}/dagents-browser.exe"

      - name: Upload browser binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-win-browser-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error

  build-windows-assistant:
    name: Assemble Windows assistant + installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-go
      - build-windows-shell
      - build-windows-browser
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Windows x64 Go binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-go-windows-amd64
          path: dist/windows-amd64

      - name: Download Windows x86 Go binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-go-windows-386
          path: dist/windows-386

      - name: Download Windows x64 shell binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-shell-windows-amd64
          path: dist/windows-amd64

      - name: Download Windows x86 shell binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-shell-windows-386
          path: dist/windows-386

      - name: Download Windows x64 browser binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-browser-windows-amd64
          path: dist/windows-amd64

      - name: Download Windows x86 browser binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-win-browser-windows-386
          path: dist/windows-386

      - name: Assemble Windows installer staging directories
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for platform in windows-amd64 windows-386; do
            PLATFORM="${platform}" VERSION="${VERSION}" \
              NODE_BIN="${GITHUB_WORKSPACE}/dist/${platform}/dagents-node.exe" \
              CLIENT_BIN="${GITHUB_WORKSPACE}/dist/${platform}/dagents-client.exe" \
              BROWSER_BIN="${GITHUB_WORKSPACE}/dist/${platform}/dagents-browser.exe" \
              SHELL_TAURI_BIN="${GITHUB_WORKSPACE}/dist/${platform}/dagents-shell-tauri.exe" \
              SHELL_LEGACY_BIN="${GITHUB_WORKSPACE}/dist/${platform}/dagents-shell-legacy.exe" \
              SHELL_BIN="${GITHUB_WORKSPACE}/dist/${platform}/dagents-shell.exe" \
              bash scripts/ci/assemble_local_assistant_bundle.sh
          done
          if compgen -G 'dist/dagents-local-assistant-windows-*.zip' > /dev/null; then
            echo 'Windows portable archives must not be generated' >&2
            exit 1
          fi
          ls -la dist/dagents-local-assistant-*

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installers (Inno x64 + x86)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for platform in windows-amd64 windows-386; do
            PLATFORM="${platform}" VERSION="${VERSION}" \
              BUNDLE_SRC="${GITHUB_WORKSPACE}/dist/dagents-local-assistant-${platform}" \
              bash scripts/ci/build_windows_installer.sh
          done
          ls -la dist-installer dist/dagents-local-assistant-windows-*-installer-*.exe

      - name: Upload Windows installer (Inno)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-windows-installers
          path: dist/dagents-local-assistant-windows-*-installer-*.exe
          if-no-files-found: error

  build-manage-docker:
    name: Build Manage offline bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit-tests
      - build-linux-assistant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download linux-amd64 local assistant
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist

      - name: Build Manage offline bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/ci/build_manage_docker.sh scripts/ci/assemble_manage_bundle.sh
          VERSION="${VERSION}" bash scripts/ci/assemble_manage_bundle.sh
          ls -la dist/dagents-manage-bundle-*

      - name: Upload Manage offline bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dagents-manage-bundle
          path: dist/dagents-manage-bundle-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-assistant
      - build-windows-assistant
      - build-manage-docker
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: dagents-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -la dist

      - name: Verify release artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.exe' \) -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          mapfile -t asset_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          (cd dist && sha256sum "${asset_names[@]}") > dist/SHA256SUMS
          VERSION="${version}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          assets = sorted(
              path for path in dist.iterdir()
              if path.is_file() and path.name.endswith((".tar.gz", ".exe"))
          )
          manifest = {
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "assets": [
                  {
                      "name": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in assets
              ],
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cat dist/SHA256SUMS
          cat dist/release-manifest.json

      - name: Create release and upload bundles
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/dagents-local-assistant-*.tar.gz
            dist/dagents-local-assistant-windows-*-installer-*.exe
            dist/dagents-manage-bundle-*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          generate_release_notes: true
