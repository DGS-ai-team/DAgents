name: Build And Release Binary

# main 上日常推送只跑单测；打 v* 标签（通常在 main 上发布新版本）才跑全矩阵打包并创建 Release。
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 与矩阵打包分离：先在同一 workflow 内跑单测，通过后再构建（release 仍依赖 build-bundle）。
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unittest discovery
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-bundle:
    name: Build Bundle (${{ matrix.target }})
    # 避免 main 上每次合并都触发多平台 PyInstaller；仅版本标签推送时产出制品。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-x64：在 **ubuntu:20.04** 容器内用 **pyenv 源码编译 3.13**（deadsnakes 已不再为 focal 提供 3.13 deb），降低 glibc 要求（避免 22.04 宿主编译导致旧系统缺 GLIBC_2.3x）
          - target: linux-x64
            os: ubuntu-22.04
            build_kind: docker-focal-amd64
            python_arch: x64
            archive_name: dagents-api-linux-x64.zip
            deb_name: dagents-backend-linux-x64.deb
            deb_arch: amd64
            api_bin_name: dagents-api
            rc_bin_name: dagents_register_center
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents_register_center --hidden-import=httpx --hidden-import=fastapi --add-data=register_center:register_center run_register_center.py
            cli_bin_name: dagents-cli
            cli_pyinstaller_args: --onefile --name dagents-cli --hidden-import=textual --hidden-import=aiohttp run_dagents_cli.py
          # linux-x86：Docker Hub 的 i386/ubuntu 无 jammy/22.04 标签；使用 focal i386 + 与 x64 相同的 **build_linux_focal_pyenv.sh**（pyenv 编译 3.13）
          - target: linux-x86
            os: ubuntu-22.04
            build_kind: docker-i386
            python_arch: x86
            archive_name: dagents-api-linux-x86.zip
            deb_name: dagents-backend-linux-x86.deb
            deb_arch: i386
            api_bin_name: dagents-api
            rc_bin_name: dagents_register_center
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents_register_center --hidden-import=httpx --hidden-import=fastapi --add-data=register_center:register_center run_register_center.py
            cli_bin_name: dagents-cli
            cli_pyinstaller_args: --onefile --name dagents-cli --hidden-import=textual --hidden-import=aiohttp run_dagents_cli.py
          - target: windows-x64
            os: windows-2022
            build_kind: native
            python_arch: x64
            archive_name: dagents-api-windows-x64.zip
            installer_name: dagents-backend-windows-x64-installer
            inno_arch: x64
            api_bin_name: dagents-api.exe
            rc_bin_name: dagents_register_center.exe
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents_register_center --hidden-import=httpx --hidden-import=fastapi --add-data="register_center;register_center" run_register_center.py
            cli_bin_name: dagents-cli.exe
            cli_pyinstaller_args: --onefile --name dagents-cli --hidden-import=textual --hidden-import=aiohttp run_dagents_cli.py
          - target: windows-x86
            os: windows-2022
            build_kind: native
            python_arch: x86
            archive_name: dagents-api-windows-x86.zip
            api_bin_name: dagents-api.exe
            rc_bin_name: dagents_register_center.exe
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents_register_center --hidden-import=httpx --hidden-import=fastapi --add-data="register_center;register_center" run_register_center.py
            cli_bin_name: dagents-cli.exe
            cli_pyinstaller_args: --onefile --name dagents-cli --hidden-import=textual --hidden-import=aiohttp run_dagents_cli.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Echo matrix (OS / 位数 / 构建方式)
        shell: bash
        run: |
          echo "target=${{ matrix.target }} build_kind=${{ matrix.build_kind }} python_arch=${{ matrix.python_arch }}"

      - name: Set up QEMU (Docker linux/386)
        if: matrix.build_kind == 'docker-i386'
        uses: docker/setup-qemu-action@v3

      - name: Setup Python (目标架构：x64 / x86)
        if: matrix.build_kind == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Install dependencies (Python packages, native build only)
        if: matrix.build_kind == 'native'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file binaries (native PyInstaller)
        if: matrix.build_kind == 'native'
        shell: bash
        run: |
          pyinstaller ${{ matrix.api_pyinstaller_args }}
          pyinstaller ${{ matrix.rc_pyinstaller_args }}
          pyinstaller ${{ matrix.cli_pyinstaller_args }}

      - name: Build single-file binaries (Linux x64 via Ubuntu 20.04 Docker + pyenv)
        if: matrix.build_kind == 'docker-focal-amd64'
        timeout-minutes: 120
        shell: bash
        env:
          API_PI_ARGS: ${{ matrix.api_pyinstaller_args }}
          RC_PI_ARGS: ${{ matrix.rc_pyinstaller_args }}
          CLI_PI_ARGS: ${{ matrix.cli_pyinstaller_args }}
          PYENV_PYTHON_VERSION: "3.13.2"
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e API_PI_ARGS -e RC_PI_ARGS -e CLI_PI_ARGS -e PYENV_PYTHON_VERSION \
            ubuntu:20.04 \
            bash /src/scripts/ci/build_linux_focal_pyenv.sh

      - name: Build single-file binaries (Linux i386 / x86 via Docker + pyenv)
        if: matrix.build_kind == 'docker-i386'
        timeout-minutes: 120
        shell: bash
        env:
          API_PI_ARGS: ${{ matrix.api_pyinstaller_args }}
          RC_PI_ARGS: ${{ matrix.rc_pyinstaller_args }}
          CLI_PI_ARGS: ${{ matrix.cli_pyinstaller_args }}
          # 与原生矩阵 Python 对齐；可在不改脚本情况下仅此变量升降级。
          PYENV_PYTHON_VERSION: "3.13.2"
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e API_PI_ARGS -e RC_PI_ARGS -e CLI_PI_ARGS -e PYENV_PYTHON_VERSION \
            i386/ubuntu:focal \
            bash /src/scripts/ci/build_linux_focal_pyenv.sh

      - name: Prepare runtime bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bundle
          cp "dist/${{ matrix.api_bin_name }}" bundle/
          cp "dist/${{ matrix.rc_bin_name }}" bundle/
          cp "dist/${{ matrix.cli_bin_name }}" bundle/
          cp startup_scripts/linux/start.sh bundle/
          cp startup_scripts/linux/start_register_center.sh bundle/
          chmod +x bundle/start.sh
          chmod +x bundle/start_register_center.sh
          cp .env.example bundle/
          cp README.md bundle/
          mkdir -p bundle/.runtime
          # **`packaging/runtime/`** → **`bundle/.runtime/`**（含 **prompt_context**、**scripts**、**data** 等占位）。
          cp -a packaging/runtime/. bundle/.runtime/
          cd bundle
          zip -r "../${{ matrix.archive_name }}" .

      - name: Build Linux deb package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "main" ]; then version="0.0.0"; fi
          bash packaging/linux/build-deb.sh "$version" "${{ matrix.deb_arch }}" "${{ matrix.deb_name }}"

      - name: Prepare runtime bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item "dist/${{ matrix.api_bin_name }}" "bundle/"
          Copy-Item "dist/${{ matrix.rc_bin_name }}" "bundle/"
          Copy-Item "dist/${{ matrix.cli_bin_name }}" "bundle/"
          Copy-Item "startup_scripts/windows/start.bat" "bundle/"
          Copy-Item "startup_scripts/windows/start_register_center.bat" "bundle/"
          Copy-Item ".env.example" "bundle/"
          Copy-Item "README.md" "bundle/"
          New-Item -ItemType Directory -Force -Path "bundle/.runtime" | Out-Null
          Copy-Item "packaging/runtime/*" "bundle/.runtime" -Recurse -Force
          # 使用 tar 打包当前目录「.」，确保含 **.runtime** 等点开头条目（Compress-Archive -Path bundle/* 易漏）。
          Set-Location bundle
          tar.exe -a -c -f "../${{ matrix.archive_name }}" .
          Set-Location ..

      - name: Install Inno Setup (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v',''
          if (-not $version -or $version -eq "main") { $version = "0.0.0" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc packaging/windows/dagents-installer.iss "/DMyAppVersion=$version" "/DMyAppArch=${{ matrix.inno_arch }}" "/DMyOutputBaseFilename=${{ matrix.installer_name }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

      - name: Upload deb artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.deb_name }}
          path: ${{ matrix.deb_name }}
          if-no-files-found: error

      - name: Upload installer artifact (Windows)
        if: matrix.target == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer_name }}.exe
          path: dist-installer/${{ matrix.installer_name }}.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dagents-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -la dist

      - name: Create release and upload bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dagents-api-*.zip
            dist/dagents-backend-linux-*.deb
            dist/dagents-backend-windows-*-installer.exe
          generate_release_notes: true
