name: Build And Release Binary

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-bundle:
    name: Build Bundle (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            api_bin_name: dagents-api
            rc_bin_name: dagents-register-center
            archive_name: dagents-api-linux-x64.zip
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents-register-center --hidden-import=httpx --hidden-import=fastapi --add-data=register-center:register-center run_register_center.py
          - target: windows-x64
            os: windows-2022
            api_bin_name: dagents-api.exe
            rc_bin_name: dagents-register-center.exe
            archive_name: dagents-api-windows-x64.zip
            api_pyinstaller_args: --onefile --name dagents-api run_agent_api.py
            rc_pyinstaller_args: --onefile --name dagents-register-center --hidden-import=httpx --hidden-import=fastapi --add-data="register-center;register-center" run_register_center.py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests (stable subset)
        run: |
          python -m unittest tests.test_agent_service tests.test_message_queue -v

      - name: Build single-file binaries
        run: |
          pyinstaller ${{ matrix.api_pyinstaller_args }}
          pyinstaller ${{ matrix.rc_pyinstaller_args }}

      - name: Prepare runtime bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bundle
          cp "dist/${{ matrix.api_bin_name }}" bundle/
          cp "dist/${{ matrix.rc_bin_name }}" bundle/
          cp startup_scripts/linux/start.sh bundle/
          cp startup_scripts/linux/start-register-center.sh bundle/
          chmod +x bundle/start.sh
          chmod +x bundle/start-register-center.sh
          cp .env.example bundle/
          cp README.md bundle/
          cp -r skills bundle/skills
          cp -r prompt_context bundle/prompt_context
          cd bundle
          zip -r "../${{ matrix.archive_name }}" .

      - name: Prepare runtime bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item "dist/${{ matrix.api_bin_name }}" "bundle/"
          Copy-Item "dist/${{ matrix.rc_bin_name }}" "bundle/"
          Copy-Item "startup_scripts/windows/start.bat" "bundle/"
          Copy-Item "startup_scripts/windows/start-register-center.bat" "bundle/"
          Copy-Item ".env.example" "bundle/"
          Copy-Item "README.md" "bundle/"
          Copy-Item "skills" "bundle/skills" -Recurse
          Copy-Item "prompt_context" "bundle/prompt_context" -Recurse
          Compress-Archive -Path bundle/* -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dagents-api-*.zip
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -la dist

      - name: Create release and upload bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dagents-api-linux-x64.zip
            dist/dagents-api-windows-x64.zip
          generate_release_notes: true
