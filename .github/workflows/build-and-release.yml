name: Build And Release Binary

# main 推送仅跑单测；打 v* 标签时构建本地助手包（Go Node + 双 TUI）并创建 GitHub Release。
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLI_PYINSTALLER_ARGS: --onefile --name dagents-cli --hidden-import=textual --hidden-import=aiohttp run_dagents_cli.py
  BROWSER_PYINSTALLER_ARGS: --onefile --name dagents-browser --paths browser-service --collect-submodules browser_use --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --hidden-import=dagents_browser --hidden-import=dagents_browser.main --hidden-import=dagents_browser.server --hidden-import=dagents_browser.driver --hidden-import=dagents_browser.action_runner --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on browser-service/run_dagents_browser.py

jobs:
  unit-tests:
    name: Unit tests (Go + Python + Web UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            manage/console/frontend/package-lock.json

      - name: Test Web UI
        run: |
          npm ci --prefix node/webui/frontend
          npm test --prefix node/webui/frontend

      - name: Build Web UI
        run: bash node/webui/build.sh

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum

      - name: Go test
        run: |
          go test ./shared/config/...
          go test ./node/...
          go test ./client/...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python unittest
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-local-assistant:
    name: Build local assistant (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            cli_build: docker-rocky8
          - platform: windows-amd64
            os: windows-2022
            goos: windows
            goarch: amd64
            cli_build: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum

      - name: Build Go binaries (dagents-node + dagents-client)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist/go-build-${{ matrix.platform }}"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            bash scripts/ci/build_go_static.sh
          EXE=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then EXE=".exe"; fi
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node${EXE}" "dist/dagents-node${EXE}"
          cp "${OUT_DIR}/bin/dagents-client${EXE}" "dist/dagents-client${EXE}"

      - name: Setup Python (Windows)
        if: matrix.cli_build == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build Python bundles (Windows native PyInstaller)
        if: matrix.cli_build == 'native'
        shell: bash
        run: |
          bash scripts/ci/build_dagents_cli.sh
          bash scripts/ci/build_dagents_browser.sh

      - name: Build Python bundles (Linux Rocky 8 Docker + pyenv, glibc 2.28)
        if: matrix.cli_build == 'docker-rocky8'
        timeout-minutes: 120
        shell: bash
        env:
          CLI_PI_ARGS: ${{ env.CLI_PYINSTALLER_ARGS }}
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
          PYENV_PYTHON_VERSION: "3.13.2"
        run: |
          set -euxo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e CLI_PI_ARGS -e BROWSER_PI_ARGS -e PYENV_PYTHON_VERSION \
            rockylinux:8 \
            bash /src/scripts/ci/build_linux_rocky8_pyenv.sh

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM="${{ matrix.platform }}" VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Install Inno Setup (Windows installer)
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        if: matrix.platform == 'windows-amd64'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION}" bash scripts/ci/build_windows_installer.sh
          ls -la dist-installer dist/dagents-local-assistant-windows-amd64-installer-*.exe

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dagents-local-assistant-${{ matrix.platform }}
          path: dist/dagents-local-assistant-${{ matrix.platform }}-*.*
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.platform == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: dagents-windows-installer
          path: dist/dagents-local-assistant-windows-amd64-installer-*.exe
          if-no-files-found: error

  build-manage-docker:
    name: Build Manage Docker image
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit-tests
      - build-local-assistant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux-amd64 local assistant
        uses: actions/download-artifact@v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist

      - name: Build and export Manage image
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/ci/build_manage_docker.sh scripts/ci/assemble_manage_bundle.sh
          VERSION="${VERSION}" bash scripts/ci/assemble_manage_bundle.sh
          ls -la dist/dagents-manage-*

      - name: Upload Manage Docker archive
        uses: actions/upload-artifact@v4
        with:
          name: dagents-manage-docker
          path: |
            dist/dagents-manage-*.tar.gz
            dist/dagents-manage-bundle-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-local-assistant
      - build-manage-docker
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dagents-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -la dist

      - name: Create release and upload bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dagents-local-assistant-*.tar.gz
            dist/dagents-local-assistant-*.zip
            dist/dagents-local-assistant-windows-amd64-installer-*.exe
            dist/dagents-manage-*.tar.gz
            dist/dagents-manage-bundle-*.tar.gz
          generate_release_notes: true
