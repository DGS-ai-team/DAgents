name: Build And Release Binary

# 仅在 v* 标签上构建本地助手包（Go Node + Web UI）并创建 GitHub Release。
# dev/main 的提交检查由 ci-required.yml 负责，避免 main push 与 tag 重复跑单测。
#
# 发版墙钟优化（相对旧矩阵串行）：
# - Linux / Windows(Go+Shell+Browser) 与单测后并行；Manage 只等 linux 包
# - Windows：Go / Tauri Shell / browser 三路并行后再 assemble+Inno
# - Linux browser：Rocky8 预装依赖镜像 + pyenv 目录 GHA cache
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write  # docker/build-push-action cache-to type=gha

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYENV_PYTHON_VERSION: "3.13.2"
  BROWSER_PYINSTALLER_ARGS: --onefile --name dagents-browser --paths browser-service --collect-submodules browser_use --collect-submodules uvicorn --collect-submodules fastapi --collect-submodules pydantic --hidden-import=dagents_browser --hidden-import=dagents_browser.main --hidden-import=dagents_browser.server --hidden-import=dagents_browser.driver --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on browser-service/run_dagents_browser.py

jobs:
  validate-release:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag source and version metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}; expected vX.Y.Z or a SemVer prerelease" >&2
            exit 1
          fi
          if [[ "${{ github.event.forced }}" == "true" ]]; then
            echo "Release tags must never be force-updated" >&2
            exit 1
          fi

          git fetch --no-tags origin main --depth=1
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must point to the current origin/main commit" >&2
            echo "tag=$(git rev-parse HEAD) main=$(git rev-parse FETCH_HEAD)" >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release metadata
        run: python scripts/release/validate_release.py --version "${GITHUB_REF_NAME#v}"

  unit-tests:
    name: Unit tests (Go + Python + Web UI)
    needs: validate-release
    if: ${{ needs.validate-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            node/webui/frontend/package-lock.json
            manage/console/frontend/package-lock.json

      - name: Test Web UI
        run: |
          npm ci --prefix node/webui/frontend
          npm test --prefix node/webui/frontend

      - name: Build Web UI
        run: bash node/webui/build.sh

      - name: Build Manage Console
        run: bash manage/console/build.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Go test
        run: |
          go test ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...
          go vet ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check manage scripts tests

      - name: Pyright
        run: python -m pyright --project pyrightconfig.json

      - name: Python unittest
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-linux-assistant:
    name: Build local assistant (linux-amd64)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Build Go binaries (dagents-node + dagents-client)
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${{ github.workspace }}/dist/go-build-linux-amd64"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS=linux GOARCH=amd64 \
            bash scripts/ci/build_go_static.sh
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node" dist/dagents-node
          cp "${OUT_DIR}/bin/dagents-client" dist/dagents-client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rocky8 browser builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/ci/Dockerfile.rocky8-browser
          load: true
          tags: dagents-rocky8-browser:ci
          cache-from: type=gha,scope=rocky8-browser-builder
          cache-to: type=gha,mode=max,scope=rocky8-browser-builder

      - name: Cache Rocky8 pyenv (CPython)
        uses: actions/cache@v4
        with:
          path: .cache/rocky8-pyenv
          key: rocky8-pyenv-${{ env.PYENV_PYTHON_VERSION }}-${{ hashFiles('browser-service/requirements.lock', 'requirements.lock') }}
          restore-keys: |
            rocky8-pyenv-${{ env.PYENV_PYTHON_VERSION }}-

      - name: Build dagents-browser (Rocky8 + cached pyenv)
        timeout-minutes: 120
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
        run: |
          set -euxo pipefail
          mkdir -p .cache/rocky8-pyenv
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -v "${GITHUB_WORKSPACE}/.cache/rocky8-pyenv:/opt/pyenv" \
            -e BROWSER_PI_ARGS \
            -e PYENV_PYTHON_VERSION \
            -e SKIP_DNF=1 \
            dagents-rocky8-browser:ci \
            bash /src/scripts/ci/build_linux_rocky8_pyenv.sh

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM=linux-amd64 VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist/dagents-local-assistant-linux-amd64-*.*
          if-no-files-found: error

  build-windows-go:
    name: Build Windows Go binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Build Go binaries
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/dist/go-build-windows-amd64"
          BUILD_CLIENT=1 OUT_DIR="${OUT_DIR}" GOOS=windows GOARCH=amd64 \
            bash scripts/ci/build_go_static.sh
          mkdir -p dist
          cp "${OUT_DIR}/bin/dagents-node.exe" dist/dagents-node.exe
          cp "${OUT_DIR}/bin/dagents-client.exe" dist/dagents-client.exe

      - name: Upload Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: ci-win-go
          path: |
            dist/dagents-node.exe
            dist/dagents-client.exe
          if-no-files-found: error

  build-windows-shell:
    name: Build Windows shell (Tauri + legacy)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/tray-tauri/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache (Tauri tray shell)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/tray-tauri/src-tauri -> target
          shared-key: release-tauri-win

      - name: Build dagents-shell (Tauri + Go legacy)
        shell: bash
        run: |
          cargo fmt --check --manifest-path desktop/tray-tauri/src-tauri/Cargo.toml
          chmod +x scripts/ci/build_dagents_shell_tauri.sh scripts/ci/build_dagents_shell.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist" bash scripts/ci/build_dagents_shell_tauri.sh
          OUT_DIR="${GITHUB_WORKSPACE}/dist" bash scripts/ci/build_dagents_shell.sh
          test -f dist/dagents-shell-tauri.exe
          test -f dist/dagents-shell-legacy.exe
          test -f dist/dagents-shell.exe

      - name: Upload shell binaries
        uses: actions/upload-artifact@v4
        with:
          name: ci-win-shell
          path: |
            dist/dagents-shell.exe
            dist/dagents-shell-tauri.exe
            dist/dagents-shell-legacy.exe
          if-no-files-found: error

  build-windows-browser:
    name: Build Windows browser (PyInstaller)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: unit-tests
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build dagents-browser
        shell: bash
        env:
          BROWSER_PI_ARGS: ${{ env.BROWSER_PYINSTALLER_ARGS }}
        run: bash scripts/ci/build_dagents_browser.sh

      - name: Upload browser binary
        uses: actions/upload-artifact@v4
        with:
          name: ci-win-browser
          path: dist/dagents-browser.exe
          if-no-files-found: error

  build-windows-assistant:
    name: Assemble Windows assistant + installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows-go
      - build-windows-shell
      - build-windows-browser
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Go binaries
        uses: actions/download-artifact@v4
        with:
          name: ci-win-go
          path: dist

      - name: Download shell binaries
        uses: actions/download-artifact@v4
        with:
          name: ci-win-shell
          path: dist

      - name: Download browser binary
        uses: actions/download-artifact@v4
        with:
          name: ci-win-browser
          path: dist

      - name: Assemble release archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PLATFORM=windows-amd64 VERSION="${VERSION}" \
            bash scripts/ci/assemble_local_assistant_bundle.sh
          ls -la dist/dagents-local-assistant-*

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (Inno)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION}" bash scripts/ci/build_windows_installer.sh
          ls -la dist-installer dist/dagents-local-assistant-windows-amd64-installer-*.exe

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: dagents-local-assistant-windows-amd64
          path: dist/dagents-local-assistant-windows-amd64-*.*
          if-no-files-found: error

      - name: Upload Windows installer (Inno)
        uses: actions/upload-artifact@v4
        with:
          name: dagents-windows-installer
          path: dist/dagents-local-assistant-windows-amd64-installer-*.exe
          if-no-files-found: error

  build-manage-docker:
    name: Build Manage offline bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit-tests
      - build-linux-assistant
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download linux-amd64 local assistant
        uses: actions/download-artifact@v4
        with:
          name: dagents-local-assistant-linux-amd64
          path: dist

      - name: Build Manage offline bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x scripts/ci/build_manage_docker.sh scripts/ci/assemble_manage_bundle.sh
          VERSION="${VERSION}" bash scripts/ci/assemble_manage_bundle.sh
          ls -la dist/dagents-manage-bundle-*

      - name: Upload Manage offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: dagents-manage-bundle
          path: dist/dagents-manage-bundle-*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux-assistant
      - build-windows-assistant
      - build-manage-docker
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dagents-*
          merge-multiple: true
          path: dist

      - name: List release assets
        run: ls -la dist

      - name: Verify release artifacts and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.exe' \) -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          mapfile -t asset_names < <(printf '%s\n' "${assets[@]##*/}" | sort)
          (cd dist && sha256sum "${asset_names[@]}") > dist/SHA256SUMS
          VERSION="${version}" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          assets = sorted(
              path for path in dist.iterdir()
              if path.is_file() and path.name.endswith((".tar.gz", ".zip", ".exe"))
          )
          manifest = {
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "assets": [
                  {
                      "name": path.name,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in assets
              ],
          }
          (dist / "release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          cat dist/SHA256SUMS
          cat dist/release-manifest.json

      - name: Create release and upload bundles
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dagents-local-assistant-*.tar.gz
            dist/dagents-local-assistant-*.zip
            dist/dagents-local-assistant-windows-amd64-installer-*.exe
            dist/dagents-manage-bundle-*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          generate_release_notes: true

  sync-main-to-dev:
    name: Open main to dev sync PR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Create or update main to dev sync PR
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        with:
          github-token: ${{ github.token }}
          script: |
            const version = process.env.RELEASE_VERSION;
            const branch = `sync/main-to-dev-${version}`;
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const dev = await github.rest.repos.getBranch({ owner, repo, branch: 'dev' });

            if (main.data.commit.sha === dev.data.commit.sha) {
              core.info('main and dev already point to the same commit; no sync PR needed.');
              return;
            }

            let branchExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              branchExists = false;
            }

            if (branchExists) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `heads/${branch}`,
                sha: main.data.commit.sha,
                force: true,
              });
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
            }

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'dev',
              head: `${owner}:${branch}`,
            });
            if (existing.data.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: 'dev',
                title: `Sync main to dev after ${version}`,
                body: [
                  `This PR synchronizes the released main commit back to dev after ${version}.`,
                  '',
                  'Please merge it after the required CI and review complete so release metadata and hotfixes are not lost from the development line.',
                ].join('\n'),
              });
            } else {
              core.info(`Sync PR already exists: #${existing.data[0].number}`);
            }

            // GITHUB_TOKEN-created pull requests do not reliably trigger pull_request workflows.
            // Dispatch CI explicitly; branch protection still requires the normal review/merge flow.
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'ci-required.yml',
              ref: branch,
            });
