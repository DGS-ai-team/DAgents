name: Go Agent+Client (AC)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Go test & build (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/webui/frontend/package-lock.json

      - name: Build Web UI
        run: bash node/webui/build.sh

      - name: Test Web UI
        run: npm test --prefix node/webui/frontend

      - name: Lint Web UI
        run: npm run lint --prefix node/webui/frontend

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            node/go.sum
            client/go.sum
            shared/config/go.sum
            shared/logfiles/go.sum
            shared/update/go.sum
            shared/workgroup/go.sum
            desktop/tray/go.sum

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t go_files < <(git ls-files '*.go')
          test -z "$(gofmt -l "${go_files[@]}")"

      - name: Download modules
        run: |
          go mod download -C shared/config
          go mod download -C shared/logfiles
          go mod download -C shared/update
          go mod download -C shared/workgroup
          go mod download -C node
          go mod download -C client
          go mod download -C desktop/tray

      - name: Build protect-loaded-skill plugin
        run: go build -buildmode=plugin -o /tmp/protect-loaded-skill.so ./node/plugins/protect-loaded-skill

      - name: Test
        run: |
          go test ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...

      - name: Vet
        run: go vet ./shared/config/... ./shared/logfiles/... ./shared/update/... ./shared/workgroup/... ./node/... ./client/... ./desktop/tray/...

      - name: Staticcheck
        run: bash scripts/ci/run_staticcheck.sh

      - name: Concurrency regression
        run: |
          cd node
          go test -race ./internal/session ./internal/turn ./internal/queue

      - name: Go vulnerability scan
        run: bash scripts/ci/run_govulncheck.sh

      - name: Build
        run: |
          go build -o /tmp/dagents-node ./node/cmd/dagents-node
          go build -o /tmp/dagents-client ./client/cmd/dagents-client

      - name: Static build smoke
        run: |
          # dagents-client: probe/update/version 运维入口
          BUILD_CLIENT=1 SKIP_WEBUI_BUILD=1 bash scripts/ci/build_go_linux_static.sh
          test -x dist/go-linux-amd64/bin/dagents-node
          test -x dist/go-linux-amd64/bin/dagents-client

      - name: Windows cross-compile smoke
        run: |
          BUILD_CLIENT=1 SKIP_WEBUI_BUILD=1 OUT_DIR=dist/go-windows-amd64 GOOS=windows GOARCH=amd64 bash scripts/ci/build_go_static.sh
          test -f dist/go-windows-amd64/bin/dagents-node.exe
          test -f dist/go-windows-amd64/bin/dagents-client.exe
