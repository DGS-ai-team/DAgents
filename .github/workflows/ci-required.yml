name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-required-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    uses: ./.github/workflows/go-ac.yml

  python:
    name: Python
    uses: ./.github/workflows/pr-tests.yml

  tauri:
    name: Tauri
    uses: ./.github/workflows/tauri-shell.yml

  packaging:
    name: Packaging
    uses: ./.github/workflows/packaging-smoke.yml

  release-preflight:
    name: Release metadata
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    uses: ./.github/workflows/release-preflight.yml

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - go
      - python
      - tauri
      - packaging
      - release-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          set -euo pipefail
          echo "go=${{ needs.go.result }}"
          echo "python=${{ needs.python.result }}"
          echo "tauri=${{ needs.tauri.result }}"
          echo "packaging=${{ needs.packaging.result }}"
          echo "release-preflight=${{ needs.release-preflight.result }}"
          [[ "${{ needs.go.result }}" == "success" ]]
          [[ "${{ needs.python.result }}" == "success" ]]
          [[ "${{ needs.tauri.result }}" == "success" ]]
          [[ "${{ needs.packaging.result }}" == "success" ]]
          [[ "${{ needs.release-preflight.result }}" == "success" || "${{ needs.release-preflight.result }}" == "skipped" ]]
