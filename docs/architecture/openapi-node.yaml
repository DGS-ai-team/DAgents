          properties:
            turn_count: {type: integer, description: "Observed lifecycle step_index count; informational statistic, not an execution limit."}
          additionalProperties: true
    NodeCompressionSettings:
      type: object
      description: Whole-block settings; GET and merge before PATCH. Idle boundaries apply only to new human turns of ordinary Agents, require an archive, and do not replace token-threshold compression.
      properties:
        silent_trigger_tokens: {type: integer, minimum: 0}
        blocking_trigger_tokens: {type: integer, minimum: 0}
        idle_new_conversation_seconds: {type: integer, minimum: 0, default: 0, description: Zero disables idle boundaries. After a completed interaction becomes idle, the next human message starts a new model context segment while retaining the transcript. Auto Agents use Dreaming instead.}
    NodeSettingsView:
      type: object
      required: [config_writable, restart_required, node, llm, manage, features, compression, memory, runtime, agent, user, onboarding, child_agents, browser, wecom, web, tools, hooks, available_tool_groups]
      properties:
        config_path: {type: string}
        config_writable: {type: boolean}
        restart_required: {type: boolean}
        node:
          type: object
          required: [listen_host, listen_port]
          properties:
            listen_host: {type: string}
            listen_port: {type: integer}
          description: Node listener only; Desktop endpoint is stored by Desktop.
        llm: {type: object, additionalProperties: true}
        manage: {$ref: '#/components/schemas/NodeManageSettingsView'}
        features: {$ref: '#/components/schemas/NodeFeatureSettingsView'}
        compression: {$ref: '#/components/schemas/NodeCompressionSettings'}
        memory: {type: object, additionalProperties: true}
        runtime: {type: object, additionalProperties: true}
        agent:
          type: object
          description: Node display profile; its name is required to complete initial Node setup.
          properties:
            name: {type: string}
            description: {type: string}
        user:
          type: object
          description: Optional preferred name for the single local profile owner; not an account or authentication identity.
          properties:
            preferred_name: {type: string}
        onboarding:
          type: object
          description: Node profile setup state only; completion does not imply that an LLM is configured or reachable.
          properties:
            node_profile_completed: {type: boolean}
        child_agents: {$ref: '#/components/schemas/NodeChildAgentLimits'}
        browser: {type: object, additionalProperties: true}
        wecom: {type: object, additionalProperties: true}
        web: {$ref: '#/components/schemas/NodeWebSettingsView'}
        tools: {$ref: '#/components/schemas/NodeToolsSettingsView'}
        hooks: {type: object, additionalProperties: true}
        available_tool_groups: {type: array, items: {type: string}}
    NodeSettingsPatch:
      type: object
      properties:
        runtime:
          type: object
          description: Optional runtime identity and log settings. A changed node_id requires Node restart; runtime_root is ignored.
          properties:
            node_id: {type: string}
            log_level: {type: string, enum: [debug, info, warn, error]}
        features: {$ref: '#/components/schemas/NodeFeatureSettingsPatch'}
        web: {$ref: '#/components/schemas/NodeWebSettingsPatch'}
        tools: {$ref: '#/components/schemas/NodeToolsSettingsPatch'}
        compression: {$ref: '#/components/schemas/NodeCompressionSettings'}
        agent:
          type: object
          description: Update the Node display profile. A non-empty name is required when completing Node setup.
          properties:
            name: {type: string}
            description: {type: string}
        user:
          type: object
          description: Optional single-owner preferred-name hint. Omit or leave empty to use no name in prompts.
          properties:
            preferred_name: {type: string}
        onboarding:
          type: object
          description: node_profile_completed tracks Node profile setup and does not indicate LLM readiness; use profile configuration and model probing to assess LLM availability.
          properties:
            node_profile_completed: {type: boolean}
        child_agents: {$ref: '#/components/schemas/NodeChildAgentLimitsPatch'}
        manage:
          type: object
          properties:
            enabled: {type: boolean}
            url: {type: string, description: Empty explicitly clears URL; enabled integration then fails validation}
            team: {type: string}
            registration_base_url: {type: string}
            workgroup_enabled: {type: boolean}
            node_token: {type: string, writeOnly: true, description: Empty preserves the saved token}
            clear_node_token: {type: boolean, description: Explicitly remove the saved token}
            registration_interval_seconds: {type: integer, minimum: 1}
            registration_ttl_seconds: {type: integer, minimum: 1}
          additionalProperties: true
      additionalProperties: true
    NodeFeatureSettingsView:
      type: object
      required: [skills_enabled, triggers_enabled, child_agents_enabled, browser_enabled, wecom_enabled, multimodal_enabled, web_search_enabled, web_fetch_enabled, skills_max_in_prompt, triggers_poll_seconds, raw_message_history_enabled, raw_message_history_source]
      properties:
        skills_enabled: {type: boolean}
        triggers_enabled: {type: boolean}
        child_agents_enabled: {type: boolean}
        browser_enabled: {type: boolean}
        wecom_enabled: {type: boolean}
        multimodal_enabled: {type: boolean}
        web_search_enabled: {type: boolean}
        web_fetch_enabled: {type: boolean}
        skills_max_in_prompt: {type: integer}
        triggers_poll_seconds: {type: integer}
        raw_message_history_enabled: {type: boolean, description: Effective value after environment override}
        raw_message_history_source: {type: string, enum: [settings, environment], description: Indicates whether the effective raw-history setting comes from Node settings or AGENT_RAW_MESSAGE_HISTORY_ENABLED}
    NodeFeatureSettingsPatch:
      type: object
      description: Sparse patch. Omitted fields retain their current values. Process-level gates remain explicitly writable for clients that send them; setup panels should send only fields they own.
      properties:
        skills_enabled: {type: boolean, description: Optional explicit process-level Skills gate}
        triggers_enabled: {type: boolean, description: Optional explicit process-level trigger gate}
        child_agents_enabled: {type: boolean, description: Optional explicit process-level child-agent gate}
        browser_enabled: {type: boolean}
        wecom_enabled: {type: boolean}
        multimodal_enabled: {type: boolean}
        web_search_enabled: {type: boolean, description: Enable the Search tool process-wide; an Agent must also select the web_search tool group}
        web_fetch_enabled: {type: boolean, description: Enable the Fetch tool process-wide; an Agent must also select the web_fetch tool group}
        skills_max_in_prompt: {type: integer, minimum: 1}
        triggers_poll_seconds: {type: integer, minimum: 1}
        raw_message_history_enabled: {type: boolean, description: Omit when AGENT_RAW_MESSAGE_HISTORY_ENABLED is present. Explicit updates return 400 and reject the entire patch without saving other fields. Invalid environment text still counts as environment-controlled and uses the documented default effective value.}
    NodeWebSettingsView:
      type: object
      required: [base_url, has_api_key]
      properties:
        base_url: {type: string, description: Shared Search/Fetch endpoint; defaults to https://api.deepseek.com}
        has_api_key: {type: boolean, description: Presence flag only; the key is never returned}
    NodeWebSettingsPatch:
      type: object
      description: Shared Search/Fetch API settings, independent of all LLM profiles. Enabled web tools require an HTTP(S) base URL and saved API key.
      properties:
        base_url: {type: string, description: Optional endpoint root or endpoint ending in /v1}
        api_key: {type: string, writeOnly: true, description: Non-empty replaces the key; empty or omitted preserves the saved key}
        clear_api_key: {type: boolean, description: Explicitly delete the saved key; cannot clear while either web tool remains enabled}
    NodeToolsSettingsView:
      type: object
      properties:
        bash_output_encoding: {type: string}
        file_encoding: {type: string}
        bash_compress_enabled: {type: boolean}
        bash_compress_max_output_chars: {type: integer, minimum: 1}
        bash_compress_max_stderr_chars: {type: integer, minimum: 1}
        bash_compress_default_max_output_chars: {type: integer, minimum: 1, readOnly: true, description: Product default exposed to support explicit reset}
        bash_compress_default_max_stderr_chars: {type: integer, minimum: 1, readOnly: true, description: Product default exposed to support explicit reset}
        bash_compress_output_mode: {type: string}
        bash_compress_tail_chars: {type: integer, minimum: 0}
        bash_compress_tail_stderr_chars: {type: integer, minimum: 0}
    NodeToolsSettingsPatch:
      type: object
      description: Sparse patch. Omitted fields are preserved; output limits must be positive integers. reset_bash_compress_limits explicitly restores both product defaults.
      properties:
        bash_output_encoding: {type: string}
        file_encoding: {type: string}
        bash_compress_enabled: {type: boolean}
        bash_compress_max_output_chars: {type: integer, minimum: 1}
        bash_compress_max_stderr_chars: {type: integer, minimum: 1}
        bash_compress_output_mode: {type: string}
        bash_compress_tail_chars: {type: integer, minimum: 0}
        bash_compress_tail_stderr_chars: {type: integer, minimum: 0}
        reset_bash_compress_limits: {type: boolean, description: Explicit reset of both output limits to product defaults}
    AutonomyV2Profile:
