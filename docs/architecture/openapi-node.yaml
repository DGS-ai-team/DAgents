openapi: 3.0.3
info:
  title: DAgents Agent Node API
  version: "0.6"
  description: |
    Agent Node 本地 HTTP API。对外契约以 **Agent** 为中心（1 Agent = 1 主对话）。
    `/v1/sessions*` 已移除（未注册 → 404）；请使用 `/v1/agents/{agent_id}/...`。
servers:
  - url: http://127.0.0.1:18765
    description: 默认本机 Node
paths:
  /health:
    get:
      summary: 探活
      responses:
        "200":
          description: OK
  /v1/agents:
    get:
      summary: 列出 Agent
      responses:
        "200":
          description: agents 列表
    post:
      summary: 创建 Agent（完整设置）
      responses:
        "200":
          description: 已创建
  /v1/agents/watermarks:
    get:
      summary: 批量读取会话版本水位
      description: 只读会话 revision 元数据，不加载 transcript 或启动冷会话。
      responses:
        "200": {description: Node stream epoch 与各会话的 revision 水位}
  /v1/agents/{agent_id}:
    get:
      summary: 获取 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Agent 视图
    patch:
      summary: 更新 Agent 快照
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已更新
    delete:
      summary: 归档 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已归档
  /v1/agents/{agent_id}/auto-config:
    get:
      summary: 获取简化 Auto 配置
      description: 自主激活频率驱动所属 Agent 的默认 trigger；每日 dreaming 独立于激活频率调度。
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: Auto 配置, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Profile"}}}}
    put:
      summary: 保存简化 Auto 配置
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2ProfileUpdate"}}}}
      responses:
        "200": {description: 已保存, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Profile"}}}}
        "409": {description: revision 冲突}
  /v1/agents/{agent_id}/auto-config/reconcile:
    post:
      summary: 重建 Auto 默认唤醒
      description: 根据当前已保存配置幂等重建系统默认 trigger，不修改配置 revision。
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        "200": {description: 已同步, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2ConfigReconcileResponse"}}}}
        "503": {description: 同步失败}
  /v1/agents/{agent_id}/experience:
    get:
      summary: 获取 Auto 经验
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: 经验；不存在时返回 experience null, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2ExperienceResponse"}}}}
  /v1/agents/{agent_id}/dreaming:
    get:
      summary: 获取每日经验整理状态
      description: 只读状态；零值时间省略。未完成经验提交的上下文重置可在关闭 dreaming 后继续恢复。
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: 当前状态, content: {application/json: {schema: {$ref: "#/components/schemas/DreamingStatus"}}}}
        "404": {description: Agent 不存在或已归档}
        "409": {description: Agent 不是自主智能体}
        "503": {description: 调度器不可用}
  /v1/agents/{agent_id}/todos:
    get:
      summary: 列出 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: Todo 列表, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoList"}}}}
    post:
      summary: 创建 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoCreate"}}}}
      responses: {"201": {description: 已创建, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Todo"}}}}}
  /v1/agents/{agent_id}/todos/{todo_id}:
    patch:
      summary: CAS 更新 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }, {name: todo_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoUpdate"}}}}
      responses: {"200": {description: 已更新, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Todo"}}}}, "409": {description: revision 冲突}}
    delete:
      summary: CAS 删除 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }, {name: todo_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoDelete"}}}}
      responses: {"200": {description: 已删除, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoDeleteResponse"}}}}, "409": {description: revision 冲突}}
  /v1/agents/{agent_id}/handbook:
    get:
      summary: 浏览 Agent 文件手册目录或读取文件
      description: 手册根目录由 Agent snapshot 的 handbook.directory 配置；空配置使用 Agent 私有默认目录。path 只能引用该目录内的相对路径。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: path
          schema: {type: string, default: ""}
          description: 空路径浏览根目录；文件返回 content 和 SHA-256 digest
      responses:
        "200":
          description: 目录包含 items（path、is_dir、size、modified_at）；文件包含 content、digest、size；根目录另含解析后的 directory
        "400": {description: 路径越界、内部历史路径或不可读取文件}
        "404": {description: Agent 或文件不存在}
        "503": {description: 手册根目录不可用}
  /v1/agents/{agent_id}/handbook/history:
    get:
      summary: 获取文件的修改历史
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: history 列出 revision、path、before_digest、after_digest、before_exists、after_exists 和 created_at；revision 表示一次修改事件。维护产生的记录还包含可选 provenance（maintenance_receipt_id、session_id、turn_id），由运行时写入；普通或旧记录可省略，不按时间推测归属。
        "400": {description: 路径无效}
        "404": {description: Agent 不存在}
        "503": {description: 历史暂不可用或需要恢复未完成写入}
  /v1/agents/{agent_id}/handbook/restore:
    post:
      summary: 恢复文件至指定修改发生前的状态
      description: 恢复生成新历史记录。撤销首次新建会删除该文件；不会调用模型。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, revision, expected_digest]
              properties:
                path: {type: string}
                revision: {type: integer, format: int64, minimum: 1}
                expected_digest: {type: string, description: 最近读取的当前文件 SHA-256 摘要}
      responses:
        "200": {description: 新增的恢复记录 entry}
        "400": {description: 路径、版本或恢复请求无效}
        "404": {description: Agent 不存在}
        "409": {description: 文件已被修改，需重新读取}
        "503": {description: 历史暂不可用或需要恢复未完成写入}
  /v1/agents/{agent_id}/ensure:
    post:
      summary: 按快照装入运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/reload:
    post:
      summary: 强制按快照重建运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/hydrate:
    get:
      summary: 获取对话 transcript、Turn 与待处理输入快照
      description: >-
        主视图返回最近 5 个终结轮次和活动轮次；assistant 草稿通过覆盖水位与 SSE 增量对齐。
        完整消息契约、序号语义和恢复规则见 docs/api/node-integration.md 的“消息、SSE 与 HITL”。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: transcript 与当前执行状态的权威快照
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentHydrateResponse"}
  /v1/agents/{agent_id}/inputs:
    get:
      summary: 查询消息提交回执
      description: 用原 client_request_id 和 conversation_epoch 对账 POST /v1/messages 的超时结果；不要为重试生成新 ID。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: client_request_id
          in: query
          required: true
          schema: {type: string, maxLength: 128}
        - name: conversation_epoch
          in: query
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200": {description: 回执 found 与原输入身份 / 状态, content: {application/json: {schema: {$ref: "#/components/schemas/InputReceiptResponse"}}}}
        "400": {description: 回执查询参数无效}
        "409": {description: conversation epoch 已改变}
  /v1/agents/{agent_id}/inputs/control:
    post:
      summary: 暂停或继续处理排队消息
      description: 使用 queue_control_revision 做 CAS。暂停不阻止新消息入队。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/InputQueueControlRequest"}
      responses:
        "200": {description: 当前暂停状态与新 revision, content: {application/json: {schema: {$ref: "#/components/schemas/InputQueueControlResponse"}}}}
        "400": {description: expected_revision 无效}
        "404": {description: Agent 不存在}
        "409": {description: queue control revision 冲突}
  /v1/agents/{agent_id}/inputs/{input_seq}:
    patch:
      summary: CAS 编辑尚未 claim 的排队消息
      description: 只允许编辑 queued 用户消息；附件字段省略表示保留，空数组表示清除。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: input_seq
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueuedInputPatch"}
      responses:
        "200": {description: 已更新的 input 身份、revision 与状态, content: {application/json: {schema: {$ref: "#/components/schemas/QueuedInputResponse"}}}}
        "400": {description: 请求或 revision 无效}
        "404": {description: Agent 或排队消息不存在}
        "409": {description: revision 冲突或消息已 claim}
    delete:
      summary: CAS 撤回尚未 claim 的排队消息
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: input_seq
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueuedInputDelete"}
      responses:
        "204": {description: 已撤回}
        "400": {description: expected_revision 无效}
        "404": {description: Agent 或排队消息不存在}
        "409": {description: revision 冲突或消息已 claim}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds:
    get:
      summary: 分页读取已结束的对话轮次
      description: cursor 使用真实 round_id；详细字段与 stale-cursor 行为见 docs/api/node-integration.md。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: before_round_id
          in: query
          schema: {type: string}
      responses:
        "200": {description: 轮次摘要与下一页锚点, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationRoundPage"}}}}
        "400": {description: 参数无效}
        "409": {description: history cursor 已失效}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/legacy-items:
    get:
      summary: 分页读取未归属轮次的早期记录
      description: 只读兼容入口；不猜测旧消息轮次归属。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: after_item_id
          in: query
          schema: {type: string}
      responses:
        "200": {description: 安全 transcript 项目及完整性标记, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationLegacyItemsPage"}}}}
        "400": {description: 参数无效}
        "409": {description: history cursor 已失效}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/revisions:
    get:
      summary: 列出轮次的只读 revision
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: 终态 revision 摘要与当前选中版本, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationRoundRevisionsResponse"}}}}
        "404": {description: 对话或轮次不存在}
        "409": {description: 轮次仍在执行}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/items:
    get:
      summary: 分页读取轮次 transcript
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: revision_id
          in: query
          schema: {type: string}
        - name: after_item_id
          in: query
          schema: {type: string}
      responses:
        "200": {description: 安全 transcript 投影、revision 身份及下一页游标, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationRoundItemsResponse"}}}}
        "400": {description: 参数无效}
        "404": {description: 对话或轮次不存在}
        "409": {description: history cursor 已失效或轮次仍活动}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/items/{item_id}/content:
    get:
      summary: 按需读取完整消息正文或 reasoning
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
        - name: item_id
          in: path
          required: true
          schema: {type: string}
        - name: revision_id
          in: query
          schema: {type: string}
        - name: part
          in: query
          schema: {type: string, enum: [content, reasoning], default: content}
      responses:
        "200": {description: 完整文本及 item_version, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationItemContentResponse"}}}}
        "400": {description: part 或路径参数无效}
        "404": {description: 对话、轮次或消息不存在}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/tool-steps:
    get:
      summary: 分页读取单个 assistant 消息的工具调用与结果配对
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
        - name: source_item_id
          in: query
          required: true
          schema: {type: string}
        - name: revision_id
          in: query
          schema: {type: string}
        - name: after_tool_call_id
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 50}
      responses:
        "200": {description: 工具调用 / 结果配对与下一页游标, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationToolStepsResponse"}}}}
        "400": {description: 参数无效}
        "404": {description: 对话或轮次不存在}
        "409": {description: history cursor 已失效或轮次仍活动}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/tool-steps/{tool_call_id}:
    get:
      summary: 按需读取指定工具调用与结果
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
        - name: tool_call_id
          in: path
          required: true
          schema: {type: string}
        - name: source_item_id
          in: query
          required: true
          schema: {type: string}
        - name: revision_id
          in: query
          schema: {type: string}
      responses:
        "200": {description: 指定工具调用与结果, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationToolStepsResponse"}}}}
        "400": {description: 参数无效}
        "404": {description: 对话、轮次或工具调用不存在}
        "409": {description: 轮次仍活动}
        "503": {description: 历史存储不可用}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/resubmit-target:
    get:
      summary: 检查末轮是否可编辑重发
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
        - name: revision_id
          in: query
          required: true
          schema: {type: string}
      responses:
        "200": {description: 目标 revision、checkpoint 与原始用户输入, content: {application/json: {schema: {$ref: "#/components/schemas/ConversationResubmitTargetResponse"}}}}
        "400": {description: revision 或路径无效}
        "404": {description: Agent 或轮次不存在}
        "409": {description: 轮次不是当前可重发目标或会话正忙}
  /v1/agents/{agent_id}/conversations/{conversation_id}/rounds/{round_id}/resubmit:
    post:
      summary: 编辑并重新执行最新已结束轮次
      description: 创建同一逻辑轮次的新 revision；不会回滚旧 revision 的文件或外部副作用。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: conversation_id
          in: path
          required: true
          schema: {type: string}
        - name: round_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConversationResubmitRequest"}
      responses:
        "200":
          description: 新 revision 的输入回执
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PostMessageResponse"}
        "400": {description: 重发请求无效}
        "409": {description: 目标 revision / checkpoint / conversation epoch 已变化或会话正忙}
        "413": {description: 消息过大}
  /v1/agents/{agent_id}/policy:
    get:
      summary: 读取该 Agent 的审批策略（SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: policy snapshot（source=sqlite）
  /v1/agents/{agent_id}/policy/tools:
    put:
      summary: 更新工具策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/policy/shell/{shell_type}:
    put:
      summary: 更新 shell 策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: shell_type
          in: path
          required: true
          schema:
            type: string
            enum: [bash, cmd, powershell]
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/prompt-context:
    get:
      summary: 读取 Agent prompt context（soul/custom/memory，SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: prompt context
    put:
      summary: 更新侧车正文
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/messages:
    post:
      summary: 入队用户消息或继续 HITL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostMessageRequest"
      responses:
        "200":
          description: 已接受；普通消息返回幂等输入身份，resume 为控制请求
          content: {application/json: {schema: {$ref: "#/components/schemas/PostMessageResponse"}}}
