  /v1/agents/{agent_id}/auto-settings:
    get:
      summary: 获取 Desktop 所需的完整 Auto 设置快照
      description: 一次返回 Auto 配置、经验、dreaming 状态和默认 trigger，减少 Desktop 的 Node 请求往返。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Auto 设置快照；Profile 字段位于响应顶层，并包含 experience、dreaming_status、trigger 与状态标志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": {description: Agent 不存在或不是自主智能体}
        "503": {description: Auto 存储不可用}

  /v1/agents/{agent_id}/model-view:
    get:
      summary: 获取 Agent 的模型视图与可选配置
      description: 合并 Agent 当前模型、有效 LLM 设置与可选配置目录，避免 Desktop 分别读取多个来源。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 返回 agent、llm_settings 与 profile_catalog
          content:
            application/json:
              schema:
                type: object
                required: [agent, llm_settings, profile_catalog]
                properties:
                  agent: {type: object}
                  llm_settings: {type: object}
                  profile_catalog:
                    type: array
                    items: {type: object}
        "404": {description: Agent 不存在或已归档}
        "503": {description: Agent 存储不可用}

  /v1/workgroups/desktop/list:
    get:
      summary: 获取 Desktop 工作组列表与订阅状态
      description: 合并全部工作组和当前 Node 的订阅列表；单个工作组附加 subscribed 标志。
      responses:
        "200":
          description: 工作组数组与 scope=desktop
          content:
            application/json:
              schema:
                type: object
                required: [workgroups, scope]
                properties:
                  workgroups: {type: array, items: {type: object}}
                  scope: {type: string, enum: [desktop]}
        "502": {description: Manage 请求失败}
        "503": {description: Manage 或工作组功能未启用}

  /v1/workgroups/{workgroupId}/desktop-progress:
    get:
      summary: 获取工作组活动与人工队列快照
      description: 并行读取工作组 Timeline 和待处理人工队列，供 Desktop 一次刷新工作组进度。
      parameters:
        - name: workgroupId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 合并的 events 与 human_queue
          content:
            application/json:
              schema:
                type: object
                required: [events, human_queue]
                properties:
                  events: {type: object}
                  human_queue: {type: object}
        "400": {description: 缺少工作组 ID}
        "502": {description: Manage 请求失败}
        "503": {description: Manage 或工作组功能未启用}

  /v1/workgroups/{workgroupId}/desktop-snapshot:
    get:
      summary: 获取工作组 Desktop 首屏快照
      description: 合并工作组、成员、Timeline、审批和当前状态需要的队列或模型配置；include_agents=true 时附带 Node 注册 Agent。
      parameters:
        - name: workgroupId
          in: path
          required: true
          schema: {type: string}
        - name: include_agents
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: 工作组及其成员、events、hitl；按状态包含 human_queue 或 llm_configs，可选 agents
          content:
            application/json:
              schema:
                type: object
                required: [workgroup, node_id, members, events, hitl]
                properties:
                  workgroup: {type: object}
                  node_id: {type: string}
                  members: {type: object}
                  events: {type: object}
                  hitl: {type: object}
                  human_queue: {type: object}
                  llm_configs: {type: object}
                  agents: {type: object}
        "400": {description: 缺少工作组 ID}
        "502": {description: Manage 请求失败}
        "503": {description: Manage 或工作组功能未启用}
components:
  schemas:
    NodeInfo:
      type: object
      required: [node_id, capabilities, multimodal_enabled, manage_enabled, workgroup_enabled, manage_registered]
      properties:
        node_id: {type: string, description: Node service identity}
        name: {type: string, description: Display name for the Node-owned primary Agent}
        capabilities: {type: array, items: {type: string}}
        multimodal_enabled: {type: boolean}
        manage_enabled: {type: boolean}
        workgroup_enabled: {type: boolean}
        manage_url: {type: string}
        manage_registered: {type: boolean}
        llm: {type: object, additionalProperties: true}
        compression: {type: object, additionalProperties: {type: integer}}
    NodeBootstrap:
      type: object
      required: [health, info, llm, user, onboarding, agent]
      properties:
        health: {type: object, additionalProperties: true}
        info: {$ref: '#/components/schemas/NodeInfo'}
        llm: {type: object, additionalProperties: true}
        user: {type: object, additionalProperties: true}
        onboarding: {type: object, additionalProperties: true}
        agent: {type: object, additionalProperties: true}
    NodeUpgradeReadiness:
      type: object
      required: [ready, has_active_turn, active_turn_count]
      properties:
        ready: {type: boolean}
        has_active_turn: {type: boolean}
        active_turn_count: {type: integer}
        active_session_ids: {type: array, items: {type: string}}
    NodeUpdateStatus:
      type: object
      required: [current_version, latest_version, upgrade_available, manage_reachable, manage_enabled, update_enabled, channel, platform, apply_command]
      properties:
        current_version: {type: string}
        latest_version: {type: string}
        upgrade_available: {type: boolean}
        manage_reachable: {type: boolean}
        manage_enabled: {type: boolean}
        update_enabled: {type: boolean}
        check_interval_seconds: {type: integer}
        last_checked_at: {type: string, format: date-time}
        channel: {type: string}
        platform: {type: string}
        release_notes: {type: string}
        message: {type: string}
        apply_command: {type: string}
        asset:
          type: object
          additionalProperties: true
          description: Manage-selected candidate; package download validates download_url, filename, sha256 and size_bytes.
    NodeManageSettingsView:
      type: object
      required: [enabled, url, team, registration_base_url, workgroup_enabled, has_node_token, registration_interval_seconds, registration_ttl_seconds]
      properties:
        enabled: {type: boolean}
        url: {type: string}
        team: {type: string}
        registration_base_url: {type: string}
        workgroup_enabled: {type: boolean}
        has_node_token: {type: boolean, description: Indicates a stored token without returning it}
        registration_interval_seconds: {type: integer}
        registration_ttl_seconds: {type: integer}
    NodeCompressionSettings:
      type: object
      description: Whole-block settings; GET and merge before PATCH. Idle boundaries apply only to new human turns of ordinary Agents, require an archive, and do not replace token-threshold compression.
      properties:
        silent_trigger_tokens: {type: integer, minimum: 0}
        blocking_trigger_tokens: {type: integer, minimum: 0}
        idle_new_conversation_seconds: {type: integer, minimum: 0, default: 0, description: Zero disables idle boundaries. After a completed interaction becomes idle, the next human message starts a new model context segment while retaining the transcript. Auto Agents use Dreaming instead.}
    NodeSettingsView:
      type: object
      required: [config_writable, restart_required, node, llm, manage, features, compression, memory, runtime, agent, user, onboarding, child_agents, browser, wecom, tools, hooks, available_tool_groups]
      properties:
        config_path: {type: string}
        config_writable: {type: boolean}
        restart_required: {type: boolean}
        node:
          type: object
          required: [listen_host, listen_port]
          properties:
            listen_host: {type: string}
            listen_port: {type: integer}
          description: Node listener only; Desktop endpoint is stored by Desktop.
        llm: {type: object, additionalProperties: true}
        manage: {$ref: '#/components/schemas/NodeManageSettingsView'}
        features: {type: object, additionalProperties: true}
        compression: {$ref: '#/components/schemas/NodeCompressionSettings'}
        memory: {type: object, additionalProperties: true}
        runtime: {type: object, additionalProperties: true}
        agent:
          type: object
          description: Node display profile; its name is required to complete initial Node setup.
          properties:
            name: {type: string}
            description: {type: string}
        user:
          type: object
          description: Optional preferred name for the single local profile owner; not an account or authentication identity.
          properties:
            preferred_name: {type: string}
        onboarding:
          type: object
          description: Node profile setup state only; completion does not imply that an LLM is configured or reachable.
          properties:
            node_profile_completed: {type: boolean}
        child_agents: {type: object, additionalProperties: true}
        browser: {type: object, additionalProperties: true}
        wecom: {type: object, additionalProperties: true}
        tools: {type: object, additionalProperties: true}
        hooks: {type: object, additionalProperties: true}
        available_tool_groups: {type: array, items: {type: string}}
    NodeSettingsPatch:
      type: object
      properties:
        compression: {$ref: '#/components/schemas/NodeCompressionSettings'}
        agent:
          type: object
          description: Update the Node display profile. A non-empty name is required when completing Node setup.
          properties:
            name: {type: string}
            description: {type: string}
        user:
          type: object
          description: Optional single-owner preferred-name hint. Omit or leave empty to use no name in prompts.
          properties:
            preferred_name: {type: string}
        onboarding:
          type: object
          description: node_profile_completed tracks Node profile setup and does not indicate LLM readiness; use profile configuration and model probing to assess LLM availability.
          properties:
            node_profile_completed: {type: boolean}
        manage:
          type: object
          properties:
            enabled: {type: boolean}
            url: {type: string, description: Empty explicitly clears URL; enabled integration then fails validation}
            team: {type: string}
            registration_base_url: {type: string}
            workgroup_enabled: {type: boolean}
            node_token: {type: string, writeOnly: true, description: Empty preserves the saved token}
            clear_node_token: {type: boolean, description: Explicitly remove the saved token}
            registration_interval_seconds: {type: integer, minimum: 1}
            registration_ttl_seconds: {type: integer, minimum: 1}
          additionalProperties: true
      additionalProperties: true
    AutonomyV2Profile:
      type: object
      required: [agent_id, revision, responsibility, wake_interval_seconds, max_tool_rounds, dreaming_enabled, dreaming_time, timezone]
      properties:
        agent_id: {type: string}
        revision: {type: integer, format: int64}
        responsibility: {type: string}
        wake_interval_seconds: {type: integer, format: int64, minimum: 0}
        max_tool_rounds: {type: integer, minimum: 1}
        dreaming_enabled: {type: boolean}
        dreaming_time: {type: string, description: 本地时间 HH:MM}
        timezone: {type: string}
    AutonomyV2ProfileUpdate:
      type: object
      required: [expected_revision, responsibility, wake_interval_seconds, max_tool_rounds, dreaming_enabled, dreaming_time, timezone]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        responsibility: {type: string}
        wake_interval_seconds: {type: integer, format: int64, minimum: 0}
        max_tool_rounds: {type: integer, minimum: 1}
        dreaming_enabled: {type: boolean}
        dreaming_time: {type: string}
        timezone: {type: string}
    AutonomyV2ConfigReconcileResponse:
      type: object
      required: [profile, trigger]
      properties:
        profile: {$ref: '#/components/schemas/AutonomyV2Profile'}
        trigger: {$ref: '#/components/schemas/TriggerDefinition'}
    DreamingStatus:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [disabled, waiting, running, succeeded, failed, recovery_pending]}
        next_at: {type: string, format: date-time}
        last_success: {type: string, format: date-time}
        last_error: {type: string}
    AutonomyV2Experience:
      type: object
      required: [agent_id, revision, content, updated_at]
      properties:
        agent_id: {type: string}
        revision: {type: integer, format: int64}
        content: {type: string}
        updated_at: {type: string, format: date-time}
    AutonomyV2ExperienceResponse:
      oneOf:
        - {$ref: '#/components/schemas/AutonomyV2Experience'}
        - type: object
          required: [experience]
          properties:
            experience: {allOf: [{$ref: '#/components/schemas/AutonomyV2Experience'}], nullable: true}
    AutonomyV2Todo:
      type: object
      required: [id, agent_id, text, status, revision]
      properties:
        id: {type: string}
        agent_id: {type: string}
        text: {type: string}
        status: {type: string, enum: [pending, in_progress, completed]}
        revision: {type: integer, format: int64}
    AutonomyV2TodoList:
      type: object
      required: [todos]
      properties:
        todos: {type: array, items: {$ref: '#/components/schemas/AutonomyV2Todo'}}
    AutonomyV2TodoCreate:
      type: object
      required: [text]
      properties: {text: {type: string}}
    AutonomyV2TodoUpdate:
      type: object
      required: [expected_revision, text, status]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        text: {type: string}
        status: {type: string, enum: [pending, in_progress, completed]}
    AutonomyV2TodoDelete:
      type: object
      required: [expected_revision]
      properties: {expected_revision: {type: integer, format: int64, minimum: 1}}
    AutonomyV2TodoDeleteResponse:
      type: object
      required: [deleted]
      properties: {deleted: {type: boolean, const: true}}
    AgentUsage:
      type: object
      properties:
        agent_id: {type: string}
        business_tokens: {type: integer, format: int64}
        maintenance_tokens: {type: integer, format: int64}
        unknown_tokens: {type: integer, format: int64}
        unknown: {type: boolean}
        unknown_reason: {type: string}
        updated_at: {type: string, format: date-time}
    AutoOverviewResponse:
      type: object
      required: [items, total, page, page_size, counts, as_of, revision]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AutoOverviewItem'}}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        counts: {type: object, additionalProperties: {type: integer}}
        as_of: {type: string, format: date-time}
        revision: {type: string, description: Opaque snapshot token, not an entity revision}
    AutoOverviewItem:
      type: object
      required: [agent_id, display_name, agent_type, workspace, state, todo_counts, dreaming]
      properties:
        agent_id: {type: string}
        display_name: {type: string}
        agent_type: {type: string, enum: [auto]}
        workspace: {$ref: '#/components/schemas/WorkspaceConfig'}
        state: {type: string, enum: [working, standby, activation_off, needs_attention]}
        state_reason: {type: string}
        responsibility: {type: string}
        wake_interval_seconds: {type: integer, format: int64}
        todo_counts: {type: object, additionalProperties: {type: integer}}
        todo_summary: {type: array, items: {type: string}}
        next_at: {type: string, format: date-time}
        profile_revision: {type: integer, format: int64}
        runtime_revision: {type: integer, format: int64}
        dreaming: {$ref: '#/components/schemas/DreamingOverview'}
    DreamingOverview:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: {type: string, enum: [unknown, disabled, waiting, running, succeeded, failed, recovery_pending]}
        next_at: {type: string, format: date-time}
        last_success: {type: string, format: date-time}
    WorkspaceConfig:
      type: object
      properties:
        mode: {type: string, enum: [private, custom]}
        path: {type: string}
    FeedbackCreateRequest:
      type: object
      required: [category, title, body]
      properties:
        client_feedback_id: {type: string}
        category: {type: string, enum: [bug, suggestion, other]}
        title: {type: string, maxLength: 256}
        body: {type: string, maxLength: 100000}
        expected_destination: {type: string}
    TriggerRecoveryRequest:
      type: object
      required: [delivery_id]
      properties:
        revision:
          type: integer
          format: int64
          description: 当前 trigger 的 revision；界面恢复请求应携带读取到的值，防止陈旧确认。
        delivery_id:
          type: string
          description: 必须与触发器当前 pending_delivery_id 完全匹配
    TriggerDefinition:
      type: object
      required: [trigger_id, name, condition, enabled]
      properties:
        trigger_id: {type: string}
        name: {type: string}
        condition:
          type: object
          additionalProperties: true
          description: interval_seconds、fire_at、schedule 三选一；可选 cmd 条件脚本由目标 Agent session/turn 经 policy/HITL 执行，退出码 0 才投递。
        target_agent_id: {type: string}
        target_session_id: {type: string, nullable: true}
        session_target_mode: {type: string, enum: [fixed]}
        client_id: {type: string, nullable: true}
        task_template: {type: string}
        enabled: {type: boolean}
        pending_delivery_id: {type: string, nullable: true}
        pending_session_id: {type: string, nullable: true}
        pending_occurrence: {type: number, format: double, nullable: true}
        pending_condition_reason: {type: string}
        pending_condition_content: {type: string}
        pending_condition_payload: {type: object, additionalProperties: true}
        pending_condition_approved: {type: boolean}
        recovery_required: {type: boolean}
        recovery_reason: {type: string}
        owner_agent_id: {type: string}
        controller: {type: string, enum: [user, auto]}
        controller_id: {type: string}
        revision: {type: integer, format: int64}
        created_by: {type: string}
    TriggerCreateRequest:
      type: object
      required: [name, condition, task_template, target_agent_id]
      properties:
        name: {type: string}
        condition:
          type: object
          additionalProperties: true
          description: interval_seconds、fire_at、schedule 三选一；可选 cmd 条件脚本由目标 Agent session/turn 经 policy/HITL 执行，退出码 0 才投递。
        target_agent_id: {type: string}
        target_session_id: {type: string, nullable: true}
        session_target_mode: {type: string, enum: [fixed]}
        task_template: {type: string}
        enabled:
          type: boolean
          default: true
    TriggerUpdateRequest:
      type: object
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        condition:
          type: object
          additionalProperties: true
          description: interval_seconds、fire_at、schedule 三选一；可选 cmd 条件脚本由目标 Agent session/turn 经 policy/HITL 执行，退出码 0 才投递。
        target_agent_id: {type: string}
        target_session_id: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        task_template: {type: string}
        enabled: {type: boolean}
        session_target_mode: {type: string, enum: [fixed]}
    FireRecord:
      type: object
      properties:
        trigger_id: {type: string}
        delivery_id:
          type: string
          description: 投递身份，用于恢复期间的 fencing
        status: {type: string, enum: [queued, skipped, error, awaiting_approval]}
  parameters:
    AgentID:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
