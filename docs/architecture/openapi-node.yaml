openapi: 3.0.3
info:
  title: DAgents Agent Node API
  version: "0.5"
  description: |
    Agent Node 本地 HTTP API。对外契约以 **Agent** 为中心（1 Agent = 1 主对话）。
    `/v1/sessions*` 已移除（未注册 → 404）；请使用 `/v1/agents/{agent_id}/...`。
servers:
  - url: http://127.0.0.1:18789
    description: 默认本机 Node
paths:
  /v1/agents/{agent_id}/risk-observations:
    get:
      summary: 查询 Auto Agent 的工具风险影子观察记录
      description: |
        最近记录优先。默认关闭风险观察；通过 Agent defaults.hooks.risk_observation_enabled 显式启用。
        观察只提供建议，不改变工具的原有审批结果。返回参数摘要，不返回原始工具参数。
      parameters:
        - name: agent_id
          in: path
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      responses:
        "200":
          description: 当前 Agent 的观察记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent_id: {type: string}
                  observations:
                    type: array
                    items:
                      type: object
                      properties:
                        agent_id: {type: string}
                        request_id: {type: string}
                        tool_name: {type: string}
                        args_digest: {type: string}
                        policy_action: {type: string}
                        level: {type: string}
                        reason: {type: string}
                        recommendation: {type: string}
                        risk_unknown: {type: boolean}
                        usage_unknown: {type: boolean}
                        created_at: {type: string, format: date-time}
        "400": {description: limit 参数无效}
        "403": {description: 非 Auto Agent}
        "404": {description: Agent 不存在或已归档}
        "503": {description: 风险观察存储不可用}
  /health:
    get:
      summary: 探活
      responses:
        "200":
          description: OK
  /v1/agents:
    get:
      summary: 列出 Agent
      responses:
        "200":
          description: agents 列表
    post:
      summary: 创建 Agent（完整设置）
      responses:
        "200":
          description: 已创建
  /v1/agents/{agent_id}:
    get:
      summary: 获取 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Agent 视图
    patch:
      summary: 更新 Agent 快照
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已更新
    delete:
      summary: 归档 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已归档
  /v1/agents/{agent_id}/handbook:
    get:
      summary: 浏览 Agent 文件手册目录或读取文件
      description: 手册根目录由 Agent snapshot 的 handbook.directory 配置；空配置使用 Agent 私有默认目录。path 只能引用该目录内的相对路径。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: path
          schema: {type: string, default: ""}
          description: 空路径浏览根目录；文件返回 content 和 SHA-256 digest
      responses:
        "200":
          description: 目录包含 items（path、is_dir、size、modified_at）；文件包含 content、digest、size；根目录另含解析后的 directory
        "400": {description: 路径越界、内部历史路径或不可读取文件}
        "404": {description: Agent 或文件不存在}
        "503": {description: 手册根目录不可用}
  /v1/agents/{agent_id}/handbook/history:
    get:
      summary: 获取文件的修改历史
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: history 列出 revision、path、before_digest、after_digest、before_exists、after_exists 和 created_at；revision 表示一次修改事件。维护产生的记录还包含可选 provenance（maintenance_receipt_id、session_id、turn_id），由运行时写入；普通或旧记录可省略，不按时间推测归属。
        "400": {description: 路径无效}
        "404": {description: Agent 不存在}
        "503": {description: 历史暂不可用或需要恢复未完成写入}
  /v1/agents/{agent_id}/handbook/restore:
    post:
      summary: 恢复文件至指定修改发生前的状态
      description: 恢复生成新历史记录。撤销首次新建会删除该文件；不会调用模型。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, revision, expected_digest]
              properties:
                path: {type: string}
                revision: {type: integer, format: int64, minimum: 1}
                expected_digest: {type: string, description: 最近读取的当前文件 SHA-256 摘要}
      responses:
        "200": {description: 新增的恢复记录 entry}
        "400": {description: 路径、版本或恢复请求无效}
        "404": {description: Agent 不存在}
        "409": {description: 文件已被修改，需重新读取}
        "503": {description: 历史暂不可用或需要恢复未完成写入}
  /v1/agents/{agent_id}/maintenance:
    get:
      summary: 获取 Agent 维护日程、最近记录与累计用量
      description: |
        未配置岗位时返回 configured=false；usage 是该 Agent 的累计维护用量，不是单次请求用量。
        next_at 是下一日历维护时刻；last 返回最近维护记录，待恢复状态不会自动重试模型调用。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 维护配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMaintenance" }
        "404": { description: Agent 不存在或不是 Auto Agent }
        "503": { description: goal store 不可用 }
    patch:
      summary: 更新 Agent 手动维护配置
      description: 使用岗位 profile revision 做 CAS 更新；必须提供 expected_revision。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMaintenancePatch" }
      responses:
        "200":
          description: 已更新，返回递增后的 profile revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMaintenancePatchResponse" }
        "400": { description: JSON、expected_revision 缺失或维护配置无效 }
        "404": { description: Agent 不存在、不是 Auto Agent 或岗位未配置 }
        "409": { description: expected_revision 冲突 }
        "503": { description: goal store 不可用 }
  /v1/agents/{agent_id}/maintenance/run:
    post:
      summary: 手动运行一次维护
      description: |
        运行一次已启用的手动维护并返回累计用量。运行中的维护、聊天或业务运行会被拒绝。
        优先处理已准备的手册执行，再处理增量记忆与手册文件。达到单次处理上限且仍有待处理手册时返回 pending。
        此操作不创建每日 occurrence；自动日程和最近 occurrence 通过维护配置接口读取。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 本批维护已处理，status 表明已完成或仍待继续
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMaintenanceRunResponse" }
        "404": { description: Agent 不存在或不是 Auto Agent }
        "409": { description: 维护未启用、Agent 忙、需要 usage recovery 或维护失败 }
        "503": { description: goal store、LLM 或维护持久化不可用 }
  /v1/agents/{agent_id}/maintenance/recovery:
    get:
      summary: 查看每日维护恢复摘要
      description: |
        返回指定日期和日程版本的执行摘要与恢复校验 token，不返回记忆候选或原始输入正文。
        两个查询参数均省略时读取最近一次每日维护；token 用于检测读取后发生的状态变化。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: local_date
          schema: {type: string, format: date}
        - in: query
          name: schedule_revision
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: 恢复摘要；读取成功不代表可以恢复
          content:
            application/json:
              schema:
                type: object
                required: [local_date, schedule_revision, stage, known, token, receipts]
                properties:
                  local_date: {type: string, format: date}
                  schedule_revision: {type: integer, format: int64}
                  stage: {type: string}
                  known: {type: boolean, description: 当前 Agent 用量是否已知}
                  used_tokens: {type: integer, format: int64, description: Agent 累计维护用量，不是本次恢复的消耗}
                  blocked_reason: {type: string, description: 上次维护记录的错误或待核对原因；不代表本次核对已经通过}
                  token: {type: string, description: 当前恢复状态的校验值}
                  receipts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        stage: {type: string}
                        status: {type: string}
                        known: {type: boolean}
                        session_id: {type: string}
                        reconciliation:
                          type: object
                          description: running/recovery 子执行的只读轮次证据核对；最多核对 8 个子执行，每个最多 4096 事件与 4 MiB payload，共享 30 秒期限。此结果不结算费用、不验证全部文件历史、不授权恢复。
                          properties:
                            completed: {type: boolean, description: 事件回放证明该轮次成功结束且模型用量完整，不代表维护批次已恢复或已完成}
                            usage_known: {type: boolean}
                            usage: {type: object, description: 事件回放所得该轮次用量，不改变 Agent 已记账用量}
                            turn_status: {type: string}
                            reason: {type: string, description: 缺绑定、超限或证据不足时的诊断原因}
        "400": {description: 查询参数无效}
        "404": {description: Agent 或维护记录不存在}
        "503": {description: 维护存储不可用}
    post:
      summary: 核对结果后继续原每日维护
      description: |
        与聊天和维护共用执行槽。核对该批次全部记忆操作的提交状态、来源、候选摘要及游标，
        并校验当前配置、执行阶段和 token 后，将原 occurrence 恢复为待处理。
        不重建执行身份、不重置预算；running、未知用量或缺失证据不能通过此接口直接重跑。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [local_date, schedule_revision, token]
              properties:
                local_date: {type: string, format: date}
                schedule_revision: {type: integer, format: int64, minimum: 1}
                token: {type: string, minLength: 1}
      responses:
        "202": {description: 已接受继续原批次，尚未完成}
        "400": {description: 请求参数无效}
        "404": {description: Agent 或维护记录不存在}
        "409": {description: Agent 忙、状态已变化、配置不允许恢复或持久化证据未通过核对}
        "503": {description: 维护存储不可用}
  /v1/agents/{agent_id}/event-sources:
    get:
      summary: 列出该 Auto Agent 的事件源及健康状态
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 事件源列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSourceView" }
        "404": { description: Agent 不存在或不是 Auto Agent }
    post:
      summary: 注册或更新事件源
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventSourceRegistration" }
      responses:
        "201": { description: 已注册 }
        "400": { description: 配置无效或 revision 冲突 }
        "403": { description: owner 不匹配 }
  /v1/agents/{agent_id}/event-sources/{source_id}:
    delete:
      summary: 按 revision 删除事件源
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: source_id
          in: path
          required: true
          schema: { type: string }
        - name: revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: 已删除 }
        "404": { description: Agent 不存在或不是 Auto Agent }
        "500": { description: CAS 失败或存储错误 }
  /v1/agents/{agent_id}/ensure:
    post:
      summary: 按快照装入运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/reload:
    post:
      summary: 强制按快照重建运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/hydrate:
    get:
      summary: 灌水对话与 HITL
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: hydrate 视图
  /v1/agents/{agent_id}/policy:
    get:
      summary: 读取该 Agent 的审批策略（SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: policy snapshot（source=sqlite）
  /v1/agents/{agent_id}/policy/tools:
    put:
      summary: 更新工具策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/policy/shell/{shell_type}:
    put:
      summary: 更新 shell 策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: shell_type
          in: path
          required: true
          schema:
            type: string
            enum: [bash, cmd, powershell]
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/prompt-context:
    get:
      summary: 读取 Agent prompt context（soul/custom/memory，SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: prompt context
    put:
      summary: 更新侧车正文
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/messages:
    post:
      summary: 入队用户消息 / HITL resume（仅 agent_id）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                content:
                  type: string
                request_type:
                  type: string
      responses:
        "200":
          description: 已入队
  /v1/streams:
    get:
      summary: SSE 事件流
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /v1/policy:
    get:
      summary: 已移除 — 请用 /v1/agents/{id}/policy
      responses:
        "404":
          description: Not Found

