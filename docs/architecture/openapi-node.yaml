          description: Staging path, identity and expiry for the native bridge

  /v1/agents/{agent_id}/workspace/writes/{operation_id}/commit:
    post:
      x-contract-status: surface-only
      summary: Validate staged content and commit under the workspace coordinator
      responses:
        "200":
          description: Committed file metadata and SHA-256 revision

  /v1/agents/{agent_id}/workspace/writes/{operation_id}/cancel:
    post:
      x-contract-status: surface-only
      summary: Cancel an uncommitted workspace operation
      responses:
        "200":
          description: Cancelled or already committed

  /v1/bootstrap:
    get:
      summary: Desktop UI bootstrap aggregate
      responses:
        "200":
          description: Aggregate containing health, info, LLM, user, onboarding, and Agent views
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeBootstrap'}

  /v1/node/info:
    get:
      summary: Node identity and capability information
      responses:
        "200":
          description: Node info DTO
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeInfo'}

  /v1/node/update:
    get:
      summary: Check the configured Manage release channel now
      responses:
        "200":
          description: Shared update.Status DTO; installation remains a Desktop Shell responsibility
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeUpdateStatus'}

  /v1/node/update/package:
    get:
      summary: Download and verify the latest update candidate
      description: Loopback only. Requires a successful update check no older than 15 minutes. No query or request body is accepted.
      responses:
        "200":
          description: Verified release bytes
          headers:
            Content-Disposition: {schema: {type: string}}
            Content-Length: {schema: {type: integer, format: int64}}
            X-Node-Package-Version: {schema: {type: string}}
            X-Node-Package-SHA256: {schema: {type: string}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "400": {description: Query/body is not accepted}
        "403": {description: Request is not loopback}
        "409": {description: Update status is unavailable or stale}
        "502": {description: Manage asset metadata, download, or integrity check failed}

  /v1/node/upgrade-readiness:
    get:
      summary: Existing session-manager upgrade readiness DTO
      description: Available before Node onboarding only to loopback callers so the local installer can check real session activity before upgrade or uninstall.
      responses:
        "200":
          description: Readiness for a Shell-controlled upgrade
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeUpgradeReadiness'}
        "403":
          description: Onboarding is incomplete and the caller is not loopback

  /v1/settings:
    get:
      summary: Read Node-owned runtime setup settings
      responses:
        "200":
          description: SettingsView; secrets are represented by presence flags, not plaintext
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeSettingsView'}
    patch:
      summary: Patch Node-owned runtime setup settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NodeSettingsPatch'}
      responses:
        "200":
          description: Updated SettingsView with write-only secret redaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeSettingsView'}
        "400":
          description: Invalid patch or an explicit raw_message_history_enabled update while AGENT_RAW_MESSAGE_HISTORY_ENABLED is present; the entire patch is rejected without persistence

  /v1/llm/probe-models:
    post:
      x-contract-status: surface-only
      summary: Route registered in the Node HTTP server
      responses:
        "200":
          description: OK


  /v1/agents/{agent_id}/auto-settings:
    get:
      summary: 获取 Desktop 所需的完整 Auto 设置快照
      description: 一次返回 Auto 配置、经验、dreaming 状态和默认 trigger，减少 Desktop 的 Node 请求往返。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Auto 设置快照；Profile 字段位于响应顶层，并包含 experience、dreaming_status、trigger 与状态标志
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": {description: Agent 不存在或不是自主智能体}
        "503": {description: Auto 存储不可用}

  /v1/agents/{agent_id}/model-view:
    get:
      summary: 获取 Agent 的模型视图与可选配置
      description: 合并 Agent 当前模型、有效 LLM 设置与可选配置目录，避免 Desktop 分别读取多个来源。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 返回 agent、llm_settings 与 profile_catalog
          content:
            application/json:
              schema:
                type: object
                required: [agent, llm_settings, profile_catalog]
                properties:
                  agent: {type: object}
                  llm_settings: {type: object}
                  profile_catalog:
                    type: array
                    items: {type: object}
        "404": {description: Agent 不存在或已归档}
        "503": {description: Agent 存储不可用}

  /v1/workgroups/desktop/list:
    get:
      summary: 获取 Desktop 工作组列表与订阅状态
      description: 合并全部工作组和当前 Node 的订阅列表；单个工作组附加 subscribed 标志。
      responses:
        "200":
          description: 工作组数组与 scope=desktop
          content:
            application/json:
              schema:
                type: object
                required: [workgroups, scope]
                properties:
                  workgroups: {type: array, items: {type: object}}
                  scope: {type: string, enum: [desktop]}
        "502": {description: Manage 请求失败}
        "503": {description: Manage 或工作组功能未启用}

  /v1/workgroups/{workgroupId}/desktop-progress:
    get:
      summary: 获取工作组活动与人工队列快照
      description: 并行读取工作组 Timeline 和待处理人工队列，供 Desktop 一次刷新工作组进度。
      parameters:
        - name: workgroupId
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: 合并的 events 与 human_queue
          content:
            application/json:
              schema:
                type: object
                required: [events, human_queue]
                properties:
                  events: {type: object}
                  human_queue: {type: object}
        "400": {description: 缺少工作组 ID}
        "502": {description: Manage 请求失败}
        "503": {description: Manage 或工作组功能未启用}

  /v1/workgroups/{workgroupId}/desktop-snapshot:
    get:
      summary: 获取工作组 Desktop 首屏快照
      description: 合并工作组、成员、Timeline、审批和当前状态需要的队列或模型配置；include_agents=true 时附带 Node 注册 Agent。
      parameters:
        - name: workgroupId
          in: path
          required: true
          schema: {type: string}
        - name: include_agents
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: 工作组及其成员、events、hitl；按状态包含 human_queue 或 llm_configs，可选 agents
          content:
            application/json:
              schema:
                type: object
                required: [workgroup, node_id, members, events, hitl]
                properties:
                  workgroup: {type: object}
                  node_id: {type: string}
                  members: {type: object}
                  events: {type: object}
                  hitl: {type: object}
                  human_queue: {type: object}
                  llm_configs: {type: object}
                  agents: {type: object}
        "400": {description: 缺少工作组 ID}
        "502": {description: Manage 请求失败}
        "503": {description: Manage 或工作组功能未启用}
components:
  schemas:
    UserContentPart:
      oneOf:
        - type: object
          required: [type]
          properties:
            type: {type: string, enum: [text]}
            text: {type: string}
        - type: object
          required: [type, image_url]
          properties:
            type: {type: string, enum: [image_url]}
            image_url: {$ref: "#/components/schemas/ImageURLPart"}
    ImageURLPart:
      type: object
      required: [url]
      properties:
        url: {type: string, description: data URL or an HTTP(S) image URL accepted by the provider}
        detail: {type: string, description: auto, low, or high; case-insensitive}
    FileReference:
      type: object
      required: [path]
      properties:
        id: {type: string}
        path: {type: string, minLength: 1, description: Node-local path selected by the user}
        name: {type: string}
        revision: {type: string}
        draft: {type: boolean}
        annotation: {type: string}
        anchor: {$ref: "#/components/schemas/FileReferenceAnchor"}
    FileReferenceAnchor:
      type: object
      properties:
        type: {type: string, enum: [file, text-range, document-text, sheet-range, pdf-region, image-region, html-region]}
        label: {type: string}
        quote: {type: string}
        location: {type: object, additionalProperties: true}
    PostMessageRequest:
      oneOf:
        - type: object
          required: [agent_id, client_request_id, conversation_epoch]
          properties:
            agent_id: {type: string}
            request_type: {type: string, enum: [message], default: message}
            content: {type: string}
            content_parts: {type: array, items: {$ref: "#/components/schemas/UserContentPart"}, maxItems: 16}
            file_refs: {type: array, items: {$ref: "#/components/schemas/FileReference"}, maxItems: 8}
            user_message_name: {type: string}
            client_request_id: {type: string, minLength: 1, maxLength: 128}
            conversation_epoch: {type: integer, format: int64, minimum: 1}
          description: 普通用户消息；request_type 可省略，默认 message。
        - type: object
          required: [agent_id, request_type]
          properties:
            agent_id: {type: string}
            request_type: {type: string, enum: [resume]}
            resume_value: {type: object, additionalProperties: true}
          description: HITL resume 控制请求，不使用消息幂等回执字段。
    PostMessageResponse:
      type: object
      required: [accepted, agent_id, priority]
      properties:
        accepted: {type: boolean}
        agent_id: {type: string}
        priority: {type: string}
        input_seq: {type: integer, format: int64}
        input_id: {type: string}
        input_revision: {type: integer, format: int64}
        status: {type: string, enum: [queued, claimed, consumed, cancelled]}
        conversation_epoch: {type: integer, format: int64}
        duplicate: {type: boolean}
    AgentHydrateResponse:
      type: object
      required: [agent_id, conversation_epoch, conversation_revision, turn_state, has_active_turn, queue_pending, queue_paused, queue_control_revision, pending_inputs, transcript, has_earlier_history, window_start_round, window_end_round, transcript_synchronized, pending_hitl, history_revision, stream_epoch, covered_agent_seq, covered_stream_seq, assistant_drafts, stream_seq_hint, agent_seq_hint, notify_seq, ack_seq, has_unread, child_agents]
      properties:
        agent_id: {type: string}
        conversation_epoch: {type: integer, format: int64}
        conversation_revision: {type: integer, format: int64}
        turn_state: {$ref: "#/components/schemas/TurnStateView"}
        has_active_turn: {type: boolean}
        queue_pending: {type: integer, minimum: 0}
        queue_paused: {type: boolean}
        queue_control_revision: {type: integer, format: int64}
        pending_inputs: {type: array, items: {$ref: "#/components/schemas/PendingInputView"}}
        transcript: {type: array, items: {$ref: "#/components/schemas/ConversationTranscriptEntry"}}
        has_earlier_history: {type: boolean}
        window_start_round: {type: integer, format: int64}
        window_end_round: {type: integer, format: int64}
        transcript_synchronized: {type: boolean}
        pending_hitl: {type: object, nullable: true, additionalProperties: true}
        history_revision: {type: integer, format: int64}
        stream_epoch: {type: string}
        covered_agent_seq: {type: integer}
        covered_stream_seq: {type: integer}
        assistant_drafts: {type: array, items: {$ref: "#/components/schemas/AssistantDraftSnapshot"}}
        stream_seq_hint: {type: integer}
        agent_seq_hint: {type: integer}
        notify_seq: {type: integer}
        ack_seq: {type: integer}
        has_unread: {type: boolean}
        child_agents: {type: array, items: {$ref: "#/components/schemas/ChildAgentView"}}
    TurnStateView:
      type: object
      required: [authority, phase, lifecycle_seq, terminal]
      properties:
        authority: {type: string, enum: [turn_coordinator]}
        phase: {type: string}
        turn_status: {type: string}
        step_status: {type: string}
        turn_id: {type: string}
        step_id: {type: string}
        step_index: {type: integer, minimum: 0}
        generation: {type: integer, format: int64}
        lifecycle_seq: {type: integer, format: int64}
        history_revision: {type: integer, format: int64}
        result_commit_status: {type: string}
        execution_stopped: {type: boolean}
        terminal: {type: boolean}
        end_reason: {type: string}
        interaction_kind: {type: string}
        recovery_required: {type: boolean}
        model_attempt: {allOf: [{$ref: "#/components/schemas/ModelAttemptView"}], nullable: true}
        error: {allOf: [{$ref: "#/components/schemas/TurnErrorView"}], nullable: true}
        tool_executions: {type: array, items: {$ref: "#/components/schemas/ToolExecutionView"}}
    ToolExecutionView:
      type: object
      required: [id, tool_call_id, tool_name, status]
      properties:
        id: {type: string}
        tool_call_id: {type: string}
        tool_name: {type: string}
        status: {type: string, enum: [proposed, pending, running, succeeded, failed, denied, cancelled, timed_out, unknown]}
        attempt: {type: integer, minimum: 1}
    ModelAttemptView:
      type: object
      required: [status, attempt, max_attempts]
      properties:
        status: {type: string}
        attempt: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 0}
        retry_after_ms: {type: integer, format: int64, minimum: 0}
    TurnErrorView:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        incomplete: {type: boolean}
    PendingInputView:
      type: object
      required: [input_id, input_seq, input_revision, status]
      properties:
        input_id: {type: string}
        client_request_id: {type: string}
        input_seq: {type: integer, format: int64}
        input_revision: {type: integer, format: int64}
        status: {type: string, enum: [queued, claimed]}
        content: {type: string}
        image_count: {type: integer, minimum: 0}
        file_refs: {type: array, items: {$ref: "#/components/schemas/FileReference"}, maxItems: 8}
    AssistantDraftSnapshot:
      type: object
      required: [item_id, attempt_id, part, text, through_chunk_seq, through_agent_seq, through_stream_seq]
      properties:
        item_id: {type: string}
        attempt_id: {type: string}
        turn_id: {type: string}
        part: {type: string, enum: [content, reasoning]}
        text: {type: string}
        through_chunk_seq: {type: integer, format: int64}
        through_agent_seq: {type: integer}
        through_stream_seq: {type: integer}
    ConversationTranscriptEntry:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [user, assistant, reasoning, tool_call, tool_result, context_boundary]}
        id: {type: string}
        item_id: {type: string}
        item_version: {type: integer, format: int64, minimum: 1}
        text: {type: string}
        summary: {type: string}
        partial: {type: boolean}
        blockId: {type: string}
        boundary_id: {type: string}
        client_request_id: {type: string}
        file_refs: {type: array, items: {$ref: "#/components/schemas/FileReference"}, maxItems: 8}
        images: {type: array, items: {type: string}}
        media: {type: array, items: {type: object, additionalProperties: true}}
        data: {type: object, additionalProperties: true}
        parent_item_id: {type: string}
        step_id: {type: string}
        tool_batch_index: {type: integer, minimum: 0}
        round_id: {type: string}
        round_ordinal: {type: integer, format: int64, minimum: 1}
        round_revision_id: {type: string}
        detail_item_id: {type: string}
        details_available: {type: boolean}
        conversation_ordinal: {type: integer, format: int64}
        conversation_entry_index: {type: integer, minimum: 0}
      additionalProperties: true
    ChildAgentView:
      type: object
      required: [child_agent_id, status, purpose, allowed_tools, loaded_skills, created_at, expires_at, turn_count, progress]
      properties:
        child_agent_id: {type: string}
        tool_call_id: {type: string}
        status: {type: string}
        purpose: {type: string}
        allowed_tools: {type: array, items: {type: string}}
        loaded_skills: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        turn_count: {type: integer, minimum: 0}
        progress: {type: object, additionalProperties: true}
    ConversationRoundPage:
      type: object
      required: [agent_id, conversation_id, conversation_revision, history_completeness, rounds, has_more]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        conversation_revision: {type: integer, format: int64}
        history_completeness: {type: string}
        rounds: {type: array, items: {$ref: "#/components/schemas/ConversationRoundSummary"}}
        has_more: {type: boolean}
        next_before_round_id: {type: string}
    ConversationRoundSummary:
      type: object
      required: [round_id, ordinal, selected_revision_id, turn_id, source, generation, status, finish_reason, record_revision, checkpoint_revision, pre_checkpoint_revision, item_count]
      properties:
        round_id: {type: string}
        ordinal: {type: integer, format: int64, minimum: 1}
        selected_revision_id: {type: string}
        turn_id: {type: string}
        source: {type: string}
        generation: {type: integer, format: int64}
        status: {type: string}
        finish_reason: {type: string}
        record_revision: {type: integer, format: int64}
        checkpoint_revision: {type: integer, format: int64}
        pre_checkpoint_revision: {type: integer, format: int64}
        item_count: {type: integer, format: int64, minimum: 0}
    ConversationLegacyItemsPage:
      type: object
      required: [agent_id, conversation_id, conversation_revision, history_completeness, item_count, items, has_more]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        conversation_revision: {type: integer, format: int64}
        history_completeness: {type: string}
        item_count: {type: integer, format: int64, minimum: 0}
        items: {type: array, items: {$ref: "#/components/schemas/ConversationTranscriptEntry"}}
        has_more: {type: boolean}
        next_after_item_id: {type: string}
    ConversationRoundItemsResponse:
      type: object
      required: [agent_id, conversation_id, conversation_revision, round_id, revision_id, revision_status, selected, items, has_more]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        conversation_revision: {type: integer, format: int64}
        round_id: {type: string}
        revision_id: {type: string}
        revision_status: {type: string}
        selected: {type: boolean}
        items: {type: array, items: {$ref: "#/components/schemas/ConversationTranscriptEntry"}}
        has_more: {type: boolean}
        next_after_item_id: {type: string}
    ConversationRoundRevisionsResponse:
      type: object
      required: [agent_id, conversation_id, conversation_revision, round_id, selected_revision_id, revisions]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        conversation_revision: {type: integer, format: int64}
        round_id: {type: string}
        selected_revision_id: {type: string}
        revisions: {type: array, items: {$ref: "#/components/schemas/ConversationRevisionSummary"}}
    ConversationRevisionSummary:
      type: object
      required: [revision_id, turn_id, source, generation, status, finish_reason, record_revision, checkpoint_revision, pre_checkpoint_revision, item_count, selected]
      properties:
        revision_id: {type: string}
        turn_id: {type: string}
        source: {type: string}
        generation: {type: integer, format: int64}
        status: {type: string}
        finish_reason: {type: string}
        record_revision: {type: integer, format: int64}
        checkpoint_revision: {type: integer, format: int64}
        pre_checkpoint_revision: {type: integer, format: int64}
        item_count: {type: integer, format: int64, minimum: 0}
        selected: {type: boolean}
    ConversationItemContentResponse:
      type: object
      required: [agent_id, conversation_id, round_id, revision_id, item_id, item_version, selected, part, text]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        round_id: {type: string}
        revision_id: {type: string}
        item_id: {type: string}
        item_version: {type: integer, format: int64}
        selected: {type: boolean}
        part: {type: string, enum: [content, reasoning]}
        text: {type: string}
    ConversationToolStepsResponse:
      type: object
      required: [agent_id, conversation_id, conversation_revision, round_id, revision_id, revision_status, selected, source_item_id, total_count, steps]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        conversation_revision: {type: integer, format: int64}
        round_id: {type: string}
        revision_id: {type: string}
        revision_status: {type: string}
        selected: {type: boolean}
        source_item_id: {type: string}
        total_count: {type: integer, minimum: 0}
        steps: {type: array, items: {$ref: "#/components/schemas/ConversationToolStep"}}
        has_more: {type: boolean}
        next_after_tool_call_id: {type: string}
    ConversationToolStep:
      type: object
      required: [tool_call_id, call_entry]
      properties:
        tool_call_id: {type: string}
        call_entry: {$ref: "#/components/schemas/ConversationTranscriptEntry"}
        result_entry: {$ref: "#/components/schemas/ConversationTranscriptEntry"}
    ConversationResubmitTargetResponse:
      type: object
      required: [agent_id, conversation_id, conversation_revision, conversation_epoch, round_id, revision_id, pre_checkpoint_revision, input]
      properties:
        agent_id: {type: string}
        conversation_id: {type: string}
        conversation_revision: {type: integer, format: int64}
        conversation_epoch: {type: integer, format: int64}
        round_id: {type: string}
        revision_id: {type: string}
        pre_checkpoint_revision: {type: integer, format: int64}
        input: {$ref: "#/components/schemas/ConversationResubmitInput"}
    ConversationResubmitInput:
      type: object
      properties:
        content: {type: string}
        content_parts: {type: array, items: {$ref: "#/components/schemas/UserContentPart"}, maxItems: 16}
        file_refs: {type: array, items: {$ref: "#/components/schemas/FileReference"}, maxItems: 8}
        user_message_name: {type: string}
    InputReceiptResponse:
      type: object
      required: [found, conversation_epoch]
      properties:
        found: {type: boolean}
        input_id: {type: string}
        input_seq: {type: integer, format: int64}
        input_revision: {type: integer, format: int64}
        status: {type: string, enum: [queued, claimed, consumed, cancelled]}
        conversation_epoch: {type: integer, format: int64}
    InputQueueControlRequest:
      type: object
      required: [paused, expected_revision]
      properties:
        paused: {type: boolean}
        expected_revision: {type: integer, format: int64, minimum: 1}
    InputQueueControlResponse:
      type: object
      required: [queue_paused, queue_control_revision]
      properties:
        queue_paused: {type: boolean}
        queue_control_revision: {type: integer, format: int64}
    QueuedInputPatch:
      type: object
      required: [expected_revision, content]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        content: {type: string}
        content_parts: {type: array, items: {$ref: "#/components/schemas/UserContentPart"}, maxItems: 16}
