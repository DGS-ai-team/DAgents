openapi: 3.0.3
info:
  title: DAgents Agent Node API
  version: "0.6"
  description: |
    Agent Node 本地 HTTP API。对外契约以 **Agent** 为中心（1 Agent = 1 主对话）。
    `/v1/sessions*` 已移除（未注册 → 404）；请使用 `/v1/agents/{agent_id}/...`。
servers:
  - url: http://127.0.0.1:18765
    description: 默认本机 Node
paths:
  /health:
    get:
      summary: 探活
      responses:
        "200":
          description: OK
  /v1/agents:
    get:
      summary: 列出 Agent
      responses:
        "200":
          description: agents 列表
    post:
      summary: 创建 Agent（完整设置）
      responses:
        "200":
          description: 已创建
  /v1/agents/{agent_id}:
    get:
      summary: 获取 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Agent 视图
    patch:
      summary: 更新 Agent 快照
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已更新
    delete:
      summary: 归档 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已归档
  /v1/agents/{agent_id}/auto-config:
    get:
      summary: 获取简化 Auto 配置
      description: 自主激活频率驱动所属 Agent 的默认 trigger；每日 dreaming 独立于激活频率调度。
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: Auto 配置, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Profile"}}}}
    put:
      summary: 保存简化 Auto 配置
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2ProfileUpdate"}}}}
      responses:
        "200": {description: 已保存, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Profile"}}}}
        "409": {description: revision 冲突}
  /v1/agents/{agent_id}/auto-config/reconcile:
    post:
      summary: 重建 Auto 默认唤醒
      description: 根据当前已保存配置幂等重建系统默认 trigger，不修改配置 revision。
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        "200": {description: 已同步, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2ConfigReconcileResponse"}}}}
        "503": {description: 同步失败}
  /v1/agents/{agent_id}/experience:
    get:
      summary: 获取 Auto 经验
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: 经验；不存在时返回 experience null, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2ExperienceResponse"}}}}
  /v1/agents/{agent_id}/dreaming:
    get:
      summary: 获取每日经验整理状态
      description: 只读状态；零值时间省略。未完成经验提交的上下文重置可在关闭 dreaming 后继续恢复。
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: 当前状态, content: {application/json: {schema: {$ref: "#/components/schemas/DreamingStatus"}}}}
        "404": {description: Agent 不存在或已归档}
        "409": {description: Agent 不是自主智能体}
        "503": {description: 调度器不可用}
  /v1/agents/{agent_id}/todos:
    get:
      summary: 列出 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      responses:
        "200": {description: Todo 列表, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoList"}}}}
    post:
      summary: 创建 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoCreate"}}}}
      responses: {"201": {description: 已创建, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Todo"}}}}}
  /v1/agents/{agent_id}/todos/{todo_id}:
    patch:
      summary: CAS 更新 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }, {name: todo_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoUpdate"}}}}
      responses: {"200": {description: 已更新, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2Todo"}}}}, "409": {description: revision 冲突}}
    delete:
      summary: CAS 删除 Auto Todo
      parameters: [{ $ref: "#/components/parameters/AgentID" }, {name: todo_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoDelete"}}}}
      responses: {"200": {description: 已删除, content: {application/json: {schema: {$ref: "#/components/schemas/AutonomyV2TodoDeleteResponse"}}}}, "409": {description: revision 冲突}}
  /v1/agents/{agent_id}/handbook:
    get:
      summary: 浏览 Agent 文件手册目录或读取文件
      description: 手册根目录由 Agent snapshot 的 handbook.directory 配置；空配置使用 Agent 私有默认目录。path 只能引用该目录内的相对路径。
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: path
          schema: {type: string, default: ""}
          description: 空路径浏览根目录；文件返回 content 和 SHA-256 digest
      responses:
        "200":
          description: 目录包含 items（path、is_dir、size、modified_at）；文件包含 content、digest、size；根目录另含解析后的 directory
        "400": {description: 路径越界、内部历史路径或不可读取文件}
        "404": {description: Agent 或文件不存在}
        "503": {description: 手册根目录不可用}
  /v1/agents/{agent_id}/handbook/history:
    get:
      summary: 获取文件的修改历史
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - in: query
          name: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: history 列出 revision、path、before_digest、after_digest、before_exists、after_exists 和 created_at；revision 表示一次修改事件。维护产生的记录还包含可选 provenance（maintenance_receipt_id、session_id、turn_id），由运行时写入；普通或旧记录可省略，不按时间推测归属。
        "400": {description: 路径无效}
        "404": {description: Agent 不存在}
        "503": {description: 历史暂不可用或需要恢复未完成写入}
  /v1/agents/{agent_id}/handbook/restore:
    post:
      summary: 恢复文件至指定修改发生前的状态
      description: 恢复生成新历史记录。撤销首次新建会删除该文件；不会调用模型。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, revision, expected_digest]
              properties:
                path: {type: string}
                revision: {type: integer, format: int64, minimum: 1}
                expected_digest: {type: string, description: 最近读取的当前文件 SHA-256 摘要}
      responses:
        "200": {description: 新增的恢复记录 entry}
        "400": {description: 路径、版本或恢复请求无效}
        "404": {description: Agent 不存在}
        "409": {description: 文件已被修改，需重新读取}
        "503": {description: 历史暂不可用或需要恢复未完成写入}
  /v1/agents/{agent_id}/ensure:
    post:
      summary: 按快照装入运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/reload:
    post:
      summary: 强制按快照重建运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/hydrate:
    get:
      summary: 灌水对话与 HITL
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: hydrate 视图
  /v1/agents/{agent_id}/policy:
    get:
      summary: 读取该 Agent 的审批策略（SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: policy snapshot（source=sqlite）
  /v1/agents/{agent_id}/policy/tools:
    put:
      summary: 更新工具策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/policy/shell/{shell_type}:
    put:
      summary: 更新 shell 策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: shell_type
          in: path
          required: true
          schema:
            type: string
            enum: [bash, cmd, powershell]
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/policy/grants:
    get:
      x-contract-status: surface-only
      summary: 读取 Agent 的工作区授权
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 授权列表
    post:
      x-contract-status: surface-only
      summary: 创建 Agent 的工作区授权
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "201":
          description: 授权已创建
  /v1/agents/{agent_id}/policy/grants/{grant_id}:
    delete:
      x-contract-status: surface-only
      summary: 撤销 Agent 的工作区授权
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: grant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 授权已撤销
  /v1/agents/{agent_id}/prompt-context:
    get:
      summary: 读取 Agent prompt context（soul/custom/memory，SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: prompt context
    put:
      summary: 更新侧车正文
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/messages:
    post:
      summary: 入队用户消息 / HITL resume（仅 agent_id）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                content:
                  type: string
                request_type:
                  type: string
      responses:
        "200":
          description: 已入队
  /v1/streams:
    get:
      summary: SSE 事件流
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /v1/policy:
    get:
      summary: 已移除 — 请用 /v1/agents/{id}/policy
      responses:
        "404":
          description: Not Found

  /v1/agent-templates/{id}:
    delete:
      x-contract-status: surface-only
      summary: Route registered in the Node HTTP server
      responses:
        "200":
          description: OK
    get:
      x-contract-status: surface-only
      summary: Route registered in the Node HTTP server
      responses:
        "200":
