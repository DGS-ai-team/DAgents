  /v1/triggers/{trigger_id}:
    delete:
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: {type: string}
        - name: revision
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 1}
          description: Expected revision for compare-and-swap deletion.
      x-contract-status: surface-only
      summary: Route registered in the Node HTTP server
      responses:
        "200":
          description: OK
        "400": {description: Invalid revision}
        "409": {description: Revision conflict or managed trigger}
    get:
      x-contract-status: surface-only
      summary: Route registered in the Node HTTP server
      responses:
        "200":
          description: OK
    patch:
      parameters:
        - name: trigger_id
          in: path
          required: true
          schema: {type: string}
      x-contract-status: surface-only
      summary: Route registered in the Node HTTP server
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TriggerUpdateRequest'}
      responses:
        "200":
          description: OK
        "400": {description: Invalid patch or revision}
        "409": {description: Revision conflict or managed trigger}

