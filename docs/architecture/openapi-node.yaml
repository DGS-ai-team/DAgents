components:
  schemas:
    AutonomyV2Profile:
      type: object
      required: [agent_id, revision, responsibility, wake_interval_seconds, max_tool_rounds, dreaming_enabled, dreaming_time, timezone]
      properties:
        agent_id: {type: string}
        revision: {type: integer, format: int64}
        responsibility: {type: string}
        wake_interval_seconds: {type: integer, format: int64, minimum: 0}
        max_tool_rounds: {type: integer, minimum: 1}
        dreaming_enabled: {type: boolean}
        dreaming_time: {type: string, description: 本地时间 HH:MM}
        timezone: {type: string}
    AutonomyV2ProfileUpdate:
      type: object
      required: [expected_revision, responsibility, wake_interval_seconds, max_tool_rounds, dreaming_enabled, dreaming_time, timezone]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 0}
        responsibility: {type: string}
        wake_interval_seconds: {type: integer, format: int64, minimum: 0}
        max_tool_rounds: {type: integer, minimum: 1}
        dreaming_enabled: {type: boolean}
        dreaming_time: {type: string}
        timezone: {type: string}
    AutonomyV2ConfigReconcileResponse:
      type: object
      required: [profile, trigger]
      properties:
        profile: {$ref: '#/components/schemas/AutonomyV2Profile'}
        trigger: {$ref: '#/components/schemas/TriggerDefinition'}
    DreamingStatus:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [disabled, waiting, running, succeeded, failed, recovery_pending]}
        next_at: {type: string, format: date-time}
        last_success: {type: string, format: date-time}
        last_error: {type: string}
    AutonomyV2Experience:
      type: object
      required: [agent_id, revision, content, updated_at]
      properties:
        agent_id: {type: string}
        revision: {type: integer, format: int64}
        content: {type: string}
        updated_at: {type: string, format: date-time}
    AutonomyV2ExperienceResponse:
      oneOf:
        - {$ref: '#/components/schemas/AutonomyV2Experience'}
        - type: object
          required: [experience]
          properties:
            experience: {allOf: [{$ref: '#/components/schemas/AutonomyV2Experience'}], nullable: true}
    AutonomyV2Todo:
      type: object
      required: [id, agent_id, text, status, revision]
      properties:
        id: {type: string}
        agent_id: {type: string}
        text: {type: string}
        status: {type: string, enum: [pending, in_progress, completed]}
        revision: {type: integer, format: int64}
    AutonomyV2TodoList:
      type: object
      required: [todos]
      properties:
        todos: {type: array, items: {$ref: '#/components/schemas/AutonomyV2Todo'}}
    AutonomyV2TodoCreate:
      type: object
      required: [text]
      properties: {text: {type: string}}
    AutonomyV2TodoUpdate:
      type: object
      required: [expected_revision, text, status]
      properties:
        expected_revision: {type: integer, format: int64, minimum: 1}
        text: {type: string}
        status: {type: string, enum: [pending, in_progress, completed]}
    AutonomyV2TodoDelete:
      type: object
      required: [expected_revision]
      properties: {expected_revision: {type: integer, format: int64, minimum: 1}}
    AutonomyV2TodoDeleteResponse:
      type: object
      required: [deleted]
      properties: {deleted: {type: boolean, const: true}}
    AgentUsage:
      type: object
      properties:
        agent_id: {type: string}
        business_tokens: {type: integer, format: int64}
        maintenance_tokens: {type: integer, format: int64}
        unknown_tokens: {type: integer, format: int64}
        unknown: {type: boolean}
        unknown_reason: {type: string}
        updated_at: {type: string, format: date-time}
    AutoOverviewResponse:
      type: object
      required: [items, total, page, page_size, counts, as_of, revision]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AutoOverviewItem'}}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        counts: {type: object, additionalProperties: {type: integer}}
        as_of: {type: string, format: date-time}
        revision: {type: string, description: Opaque snapshot token, not an entity revision}
    AutoOverviewItem:
      type: object
      required: [agent_id, display_name, agent_type, workspace, state, todo_counts, dreaming]
      properties:
        agent_id: {type: string}
        display_name: {type: string}
        agent_type: {type: string, enum: [auto]}
        workspace: {$ref: '#/components/schemas/WorkspaceConfig'}
        state: {type: string, enum: [working, standby, activation_off, needs_attention]}
        state_reason: {type: string}
        responsibility: {type: string}
        wake_interval_seconds: {type: integer, format: int64}
        todo_counts: {type: object, additionalProperties: {type: integer}}
        todo_summary: {type: array, items: {type: string}}
        next_at: {type: string, format: date-time}
        profile_revision: {type: integer, format: int64}
        runtime_revision: {type: integer, format: int64}
        dreaming: {$ref: '#/components/schemas/DreamingOverview'}
    DreamingOverview:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: {type: string, enum: [unknown, disabled, waiting, running, succeeded, failed, recovery_pending]}
        next_at: {type: string, format: date-time}
        last_success: {type: string, format: date-time}
    WorkspaceConfig:
      type: object
      properties:
        mode: {type: string, enum: [private, custom]}
        path: {type: string}
    FeedbackCreateRequest:
      type: object
      required: [category, title, body]
      properties:
        client_feedback_id: {type: string}
        category: {type: string, enum: [bug, suggestion, other]}
        title: {type: string, maxLength: 256}
        body: {type: string, maxLength: 100000}
        expected_destination: {type: string}
    TriggerRecoveryRequest:
      type: object
      required: [delivery_id]
      properties:
        revision:
          type: integer
          format: int64
          description: 当前 trigger 的 revision；界面恢复请求应携带读取到的值，防止陈旧确认。
        delivery_id:
          type: string
          description: 必须与触发器当前 pending_delivery_id 完全匹配
    TriggerDefinition:
      type: object
      required: [trigger_id, name, condition, enabled]
      properties:
        trigger_id: {type: string}
        name: {type: string}
        condition: {type: object, additionalProperties: true}
        target_agent_id: {type: string}
        target_session_id: {type: string, nullable: true}
        session_target_mode: {type: string, enum: [fixed]}
        client_id: {type: string, nullable: true}
        task_template: {type: string}
        enabled: {type: boolean}
        pending_delivery_id: {type: string, nullable: true}
        pending_session_id: {type: string, nullable: true}
        recovery_required: {type: boolean}
        recovery_reason: {type: string}
        owner_agent_id: {type: string}
        controller: {type: string, enum: [user, goal, maintenance]}
        controller_id: {type: string}
        revision: {type: integer, format: int64}
        created_by: {type: string}
    TriggerCreateRequest:
      type: object
      required: [name, condition, task_template, target_agent_id]
      properties:
        name: {type: string}
        condition: {type: object, additionalProperties: true}
        target_agent_id: {type: string}
        target_session_id: {type: string, nullable: true}
        session_target_mode: {type: string, enum: [fixed]}
        task_template: {type: string}
        enabled:
          type: boolean
          default: true
    TriggerUpdateRequest:
      type: object
      properties:
        revision: {type: integer, format: int64, minimum: 1}
        name: {type: string}
        condition: {type: object, additionalProperties: true}
        target_agent_id: {type: string}
        target_session_id: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        task_template: {type: string}
        enabled: {type: boolean}
        session_target_mode: {type: string, enum: [fixed]}
    FireRecord:
      type: object
      properties:
        trigger_id: {type: string}
        delivery_id:
          type: string
          description: 投递身份，用于恢复期间的 fencing
        status: {type: string}
  parameters:
    AgentID:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
