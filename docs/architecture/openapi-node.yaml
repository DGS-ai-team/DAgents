openapi: 3.0.3
info:
  title: DAgents Agent Node API
  version: "0.5"
  description: |
    Agent Node 本地 HTTP API。对外契约以 **Agent** 为中心（1 Agent = 1 主对话）。
    `/v1/sessions*` 已移除（未注册 → 404）；请使用 `/v1/agents/{agent_id}/...`。
servers:
  - url: http://127.0.0.1:18789
    description: 默认本机 Node
paths:
  /health:
    get:
      summary: 探活
      responses:
        "200":
          description: OK
  /v1/agents:
    get:
      summary: 列出 Agent
      responses:
        "200":
          description: agents 列表
    post:
      summary: 创建 Agent（完整设置）
      responses:
        "200":
          description: 已创建
  /v1/agents/{agent_id}:
    get:
      summary: 获取 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Agent 视图
    patch:
      summary: 更新 Agent 快照
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已更新
    delete:
      summary: 归档 Agent
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 已归档
  /v1/agents/{agent_id}/maintenance:
    get:
      summary: 获取 Agent 手动维护配置与累计用量
      description: |
        未配置岗位时返回 configured=false；usage 是该 Agent 的累计维护用量，不是单次请求用量。
        手动维护已实现，日程自动 controller 尚未接入本接口契约。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 维护配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMaintenance" }
        "404": { description: Agent 不存在或不是 Auto Agent }
        "503": { description: goal store 不可用 }
    patch:
      summary: 更新 Agent 手动维护配置
      description: 使用岗位 profile revision 做 CAS 更新；必须提供 expected_revision。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentMaintenancePatch" }
      responses:
        "200":
          description: 已更新，返回递增后的 profile revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMaintenancePatchResponse" }
        "400": { description: JSON、expected_revision 缺失或维护配置无效 }
        "404": { description: Agent 不存在、不是 Auto Agent 或岗位未配置 }
        "409": { description: expected_revision 冲突 }
        "503": { description: goal store 不可用 }
  /v1/agents/{agent_id}/maintenance/run:
    post:
      summary: 手动运行一次维护
      description: |
        运行一次已启用的手动维护并返回累计用量。运行中的维护、聊天或业务运行会被拒绝。
        日程自动触发尚未接入；此操作不会创建或返回 next_at。
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 维护完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentMaintenanceRunResponse" }
        "404": { description: Agent 不存在或不是 Auto Agent }
        "409": { description: 维护未启用、Agent 忙、需要 usage recovery 或维护失败 }
        "503": { description: goal store、LLM 或维护持久化不可用 }
  /v1/agents/{agent_id}/event-sources:
    get:
      summary: 列出该 Auto Agent 的事件源及健康状态
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: 事件源列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSourceView" }
        "404": { description: Agent 不存在或不是 Auto Agent }
    post:
      summary: 注册或更新事件源
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventSourceRegistration" }
      responses:
        "201": { description: 已注册 }
        "400": { description: 配置无效或 revision 冲突 }
        "403": { description: owner 不匹配 }
  /v1/agents/{agent_id}/event-sources/{source_id}:
    delete:
      summary: 按 revision 删除事件源
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: source_id
          in: path
          required: true
          schema: { type: string }
        - name: revision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: 已删除 }
        "404": { description: Agent 不存在或不是 Auto Agent }
        "500": { description: CAS 失败或存储错误 }
  /v1/agents/{agent_id}/ensure:
    post:
      summary: 按快照装入运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/reload:
    post:
      summary: 强制按快照重建运行时
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/hydrate:
    get:
      summary: 灌水对话与 HITL
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: hydrate 视图
  /v1/agents/{agent_id}/policy:
    get:
      summary: 读取该 Agent 的审批策略（SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: policy snapshot（source=sqlite）
  /v1/agents/{agent_id}/policy/tools:
    put:
      summary: 更新工具策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/policy/shell/{shell_type}:
    put:
      summary: 更新 shell 策略
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: shell_type
          in: path
          required: true
          schema:
            type: string
            enum: [bash, cmd, powershell]
      responses:
        "200":
          description: OK
  /v1/agents/{agent_id}/prompt-context:
    get:
      summary: 读取 Agent prompt context（soul/custom/memory，SQLite）
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: prompt context
    put:
      summary: 更新侧车正文
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: OK
  /v1/messages:
    post:
      summary: 入队用户消息 / HITL resume（仅 agent_id）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id:
                  type: string
                content:
                  type: string
                request_type:
                  type: string
      responses:
        "200":
          description: 已入队
  /v1/streams:
    get:
      summary: SSE 事件流
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /v1/policy:
    get:
      summary: 已移除 — 请用 /v1/agents/{id}/policy
      responses:
        "404":
          description: Not Found

