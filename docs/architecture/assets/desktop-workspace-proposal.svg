  <path d="M68 906h13M70 902l-2 4 2 4M79 902l2 4-2 4" fill="none" stroke="#a6acba" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="911" class="muted" font-size="13">设置</text>

  <!-- Conversation pane -->
  <rect x="293" y="201" width="795" height="735" fill="#171920"/>
  <line x1="293" y1="258" x2="1088" y2="258" stroke="#30343e"/>
  <rect x="316" y="216" width="30" height="30" rx="9" fill="#34304b"/>
  <circle cx="331" cy="225" r="4.2" fill="none" stroke="#c9c1ff" stroke-width="1.2"/>
  <path d="M324 239c1-5 13-5 14 0" fill="none" stroke="#c9c1ff" stroke-width="1.2" stroke-linecap="round"/>
  <text x="357" y="231" class="primary" font-size="14" font-weight="700">研究助手</text>
  <text x="357" y="247" class="faint" font-size="11">常规智能体 · 当前会话</text>
  <circle cx="493" cy="232" r="3" fill="#6dd1a0"/>
