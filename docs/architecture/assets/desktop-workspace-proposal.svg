  <rect x="235" y="216" width="34" height="30" rx="7" fill="#292c35" stroke="#3a3e49"/>
  <path d="M252 224v14M245 231h14" stroke="#aeb4c2" stroke-width="1.5" stroke-linecap="round"/>

  <text x="62" y="280" class="muted" font-size="12" font-weight="700" letter-spacing=".5">智能体</text>
  <path d="M66 303h14M70 299l-4 4 4 4M76 299l4 4-4 4" fill="none" stroke="#9da3b1" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="52" y="291" width="226" height="42" rx="8" fill="#303343"/>
