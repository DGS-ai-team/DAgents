<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">DAgents Desktop 工作区布局提案</title>
  <desc id="desc">深色桌面应用效果图，展示将应用菜单、品牌、Node 状态与窗口控制合并为一行的顶栏，以及智能体侧边栏、中间对话栏和右侧终端资源工作台。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171920"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#6c8dff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#08090c" flood-opacity=".35"/>
    </filter>
    <style>
      text { font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .primary { fill: #eceef5; }
      .muted { fill: #9298a8; }
      .faint { fill: #707687; }
      .stroke { stroke: #343844; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 15px; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: .2px; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f3f4f8"/>
  <text x="48" y="42" fill="#20232c" font-size="23" font-weight="700">DAgents Desktop · 工作区布局提案</text>
  <text x="48" y="68" fill="#656b78" font-size="14">顶栏收纳全局命令，侧栏选择工作对象，对话聚焦当前任务，资源工作台承载终端、浏览器与文件。</text>

  <!-- Desktop window -->
  <g filter="url(#shadow)">
    <rect x="40" y="94" width="1520" height="799" rx="14" fill="#171920" stroke="#cdd0d9" stroke-width="1"/>
  </g>

  <!-- Window titlebar -->
  <path d="M54 94h1492a14 14 0 0 1 14 14v50H40v-50a14 14 0 0 1 14-14Z" fill="#20232b"/>
  <rect x="60" y="108" width="30" height="30" rx="9" fill="#2d3040" stroke="#474b61"/>
  <path d="M69 123h12M75 117v12M70.8 118.8l8.4 8.4M79.2 118.8l-8.4 8.4" stroke="#c6beff" stroke-width="1.5" stroke-linecap="round"/>
  <text x="101" y="128" class="primary" font-size="15" font-weight="700">DAgents</text>
  <text x="174" y="128" class="faint" font-size="14">Desktop</text>
  <rect x="1224" y="105" width="244" height="34" rx="9" fill="#292c35" stroke="#414550"/>
  <circle cx="1243" cy="122" r="4" fill="#69d3a0"/>
  <text x="1255" y="127" class="primary" font-size="13" font-weight="600">本地 Node</text>
  <text x="1321" y="127" class="muted" font-size="12">已连接</text>
  <path d="m1444 119 5 5 5-5" fill="none" stroke="#aab0bf" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1490 121h13M1522 115l12 12M1534 115l-12 12" stroke="#858b99" stroke-width="1.4" stroke-linecap="round"/>

  <!-- One integrated title/menu bar -->
  <line x1="40" y1="158" x2="1560" y2="158" stroke="#343742"/>
  <text x="238" y="130" class="primary" font-size="13" font-weight="600">文件</text>
  <text x="285" y="130" class="muted" font-size="13">编辑</text>
  <rect x="323" y="105" width="48" height="34" rx="7" fill="#303343"/>
  <text x="334" y="130" class="primary" font-size="13" font-weight="600">视图</text>
  <text x="384" y="130" class="muted" font-size="13">智能体</text>
  <text x="448" y="130" class="muted" font-size="13">节点</text>
  <text x="497" y="130" class="muted" font-size="13">帮助</text>
  <rect x="612" y="109" width="376" height="32" rx="8" fill="#242730" stroke="#383c48"/>
  <circle cx="631" cy="125" r="6" fill="none" stroke="#8990a0" stroke-width="1.4"/>
  <path d="m635.5 129.5 4 4" stroke="#8990a0" stroke-width="1.4" stroke-linecap="round"/>
  <text x="648" y="130" class="muted" font-size="13">搜索命令、智能体或会话…</text>
  <rect x="918" y="116" width="56" height="18" rx="4" fill="#303440"/>
  <text x="925" y="129" fill="#aeb4c2" font-size="9" font-weight="600">Ctrl Shift P</text>

  <g transform="translate(0,-43)">
