  <circle cx="1060" cy="221" r="3" fill="#9285ff"/>

  <text x="330" y="302" class="faint" font-size="11">今天 10:42</text>
  <rect x="330" y="318" width="590" height="66" rx="12" fill="#23262f" stroke="#30343f"/>
  <text x="350" y="344" class="primary" font-size="14">帮我检查最近一次构建失败的原因，并整理一个修复建议。</text>
  <text x="350" y="367" class="muted" font-size="12">我会先检查构建日志和相关改动，再把证据与建议整理出来。</text>

  <rect x="330" y="411" width="700" height="192" rx="12" fill="#1d2028" stroke="#30343e"/>
  <rect x="348" y="429" width="26" height="26" rx="8" fill="#293b3a"/>
  <path d="M356 437h10v10h-10zM359 434v3M363 434v3" fill="none" stroke="#85d6b0" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="385" y="442" class="primary" font-size="13" font-weight="700">检查结果</text>
  <text x="348" y="477" class="muted" font-size="13">构建在前端类型检查阶段失败，错误集中在设置页的资源状态类型。</text>
  <text x="348" y="500" class="muted" font-size="13">我已定位到两个未同步更新的调用点。下面是最小修复方案：</text>
  <rect x="348" y="520" width="653" height="56" rx="8" fill="#15171d" stroke="#2c303a"/>
  <circle cx="368" cy="548" r="4" fill="#8e82ff"/>
  <text x="383" y="545" class="primary" font-size="12" font-weight="600">修复设置页的资源状态类型定义</text>
  <text x="383" y="563" class="faint" font-size="11">2 个文件 · 尚未修改</text>

  <rect x="330" y="625" width="606" height="70" rx="11" fill="#20232b" stroke="#353944"/>
  <rect x="346" y="641" width="29" height="29" rx="8" fill="#292d39"/>
  <path d="M354 649h13v9h-13zM357 661h7" fill="none" stroke="#b0b6c5" stroke-width="1.2" stroke-linejoin="round"/>
  <text x="387" y="650" class="primary" font-size="12" font-weight="600">已打开终端</text>
  <text x="387" y="670" class="muted" font-size="11">Node: 本地 Node · Agent: 研究助手</text>
  <rect x="831" y="642" width="88" height="29" rx="7" fill="#302d49"/>
  <text x="849" y="661" fill="#c6beff" font-size="11" font-weight="600">查看资源</text>

  <!-- Composer -->
  <rect x="319" y="836" width="742" height="76" rx="14" fill="#22252e" stroke="#444957" stroke-width="1.2"/>
  <text x="342" y="865" class="muted" font-size="13">继续与研究助手对话…</text>
  <path d="M347 884h14M354 877v14" stroke="#9da4b3" stroke-width="1.5" stroke-linecap="round"/>
