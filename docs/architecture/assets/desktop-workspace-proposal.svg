  <text x="243" y="475" fill="#c8c2f5" font-size="9" font-weight="600">总览</text>
  <rect x="62" y="493" width="25" height="25" rx="8" fill="#293b3a"/>
  <circle cx="74.5" cy="505.5" r="6.2" fill="none" stroke="#83d4b0" stroke-width="1.4"/>
  <path d="M74.5 501v5l3 2" fill="none" stroke="#83d4b0" stroke-width="1.2" stroke-linecap="round"/>
