<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">DAgents color system</title>
  <desc id="desc">DAgents Node 与 Manage 共用的色彩 token 设计稿，包含深色与浅色表面、交互状态、语义状态和第三方品牌色例外。</desc>
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101b"/><stop offset=".58" stop-color="#0c1727"/><stop offset="1" stop-color="#11182a"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7f3ff"/><stop offset="1" stop-color="#36c9e3"/></linearGradient>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3adff"/><stop offset="1" stop-color="#6e6adb"/></linearGradient>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 35.5h36M35.5 0v36" stroke="#7192bd" stroke-opacity=".055"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020611" flood-opacity=".30"/></filter>
    <style>
      .label{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;fill:#eff7ff}
      .title{font-size:16px;font-weight:750;letter-spacing:.04em}.note{font-size:11px;fill:#8ea5bd}
      .token{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#eef6ff}.value{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#a7bad0}
      .caption{font-size:11px;fill:#8ea5bd}.small{font-size:10px;fill:#7c93ab}.dark-text{fill:#18253a}.light-text{fill:#edf6ff}
      .icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon-fill{fill:currentColor;stroke:none}
    </style>
    <symbol id="i-snowflake" viewBox="0 0 24 24"><path class="icon" d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M8.5 5l3.5 2 3.5-2M8.5 19l3.5-2 3.5 2"/><path class="icon" d="m12 9.2 2.8 2.8-2.8 2.8-2.8-2.8Z"/></symbol>
    <symbol id="i-agent" viewBox="0 0 24 24"><circle class="icon" cx="12" cy="8" r="3"/><path class="icon" d="M5.5 20c.4-3.8 2.6-6 6.5-6s6.1 2.2 6.5 6"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><ellipse class="icon" cx="12" cy="12" rx="8" ry="4" transform="rotate(-28 12 12)"/><circle class="icon" cx="12" cy="12" r="2"/><path class="icon" d="m18.2 5.5.6 2.2 2.1.7-2.1.7-.6 2.2-.7-2.2-2.1-.7 2.1-.7Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path class="icon" d="m5.5 12.5 4 4 9-9"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path class="icon" d="m12 4 8 15H4Z"/><path class="icon" d="M12 9v4M12 16.5h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle class="icon" cx="12" cy="12" r="8"/><path class="icon" d="M12 10.5v5M12 7.5h.01"/></symbol>
    <symbol id="i-loading" viewBox="0 0 24 24"><path class="icon" d="M19 12a7 7 0 0 1-12 5M5 12A7 7 0 0 1 17 7"/><path class="icon" d="m16 4 1 3-3 1M8 20l-1-3 3-1"/></symbol>
    <g id="panel-dark"><rect width="740" height="296" rx="14" fill="#0b1728" stroke="#29445f"/></g>
    <g id="panel-light"><rect width="740" height="296" rx="14" fill="#f8fafc" stroke="#d4dee9"/></g>
  </defs>

  <rect width="1600" height="1160" fill="url(#board)"/><rect width="1600" height="1160" fill="url(#grain)"/>
  <text x="48" y="54" class="label" font-size="28" font-weight="750">DAgents 色彩系统</text>
  <text x="50" y="82" class="label" font-size="13" fill="#a4b9d0">Node + Manage shared semantic tokens · one brand language · dark/light readable</text>
  <g transform="translate(1150 28)"><rect width="390" height="76" rx="12" fill="#102136" stroke="#345575"/><text x="20" y="24" class="caption">配色配额</text><rect x="20" y="35" width="280" height="12" rx="6" fill="#283a4d"/><rect x="20" y="35" width="224" height="12" rx="6" fill="#26384d"/><rect x="244" y="35" width="42" height="12" fill="url(#ice)"/><rect x="286" y="35" width="14" height="12" rx="0 6 6 0" fill="#e2a73d"/><text x="20" y="66" class="small">80% 中性表面</text><text x="132" y="66" class="small">15% 品牌冷色</text><text x="260" y="66" class="small">5% 语义强调</text></g>

  <!-- Shared token architecture -->
  <g transform="translate(40 130)"><rect width="1520" height="220" rx="16" fill="#0b1728" fill-opacity=".78" stroke="#28445f"/><text x="24" y="32" class="label title">01  共享 token 架构</text><text x="224" y="32" class="note">Node 与 Manage 只切换表面明度，共用同一套品牌与语义色</text>
    <g transform="translate(24 50)"><text x="0" y="16" class="caption">中性表面 80% · 层级优先于染色</text><rect x="0" y="30" width="700" height="32" rx="7" fill="#0b1220" stroke="#334962"/><rect x="12" y="39" width="24" height="14" rx="3" fill="#0b1220"/><text x="48" y="50" class="token">surface-0</text><text x="180" y="50" class="value">#0B1220 / #F8FAFC</text><text x="350" y="50" class="caption">页面底</text><rect x="0" y="70" width="700" height="32" rx="7" fill="#111c2d" stroke="#334962"/><rect x="12" y="79" width="24" height="14" rx="3" fill="#111c2d"/><text x="48" y="90" class="token">surface-1</text><text x="180" y="90" class="value">#111C2D / #F1F5F9</text><text x="350" y="90" class="caption">侧栏 / 卡片</text><rect x="0" y="110" width="700" height="32" rx="7" fill="#16263b" stroke="#334962"/><rect x="12" y="119" width="24" height="14" rx="3" fill="#16263b"/><text x="48" y="130" class="token">surface-2</text><text x="180" y="130" class="value">#16263B / #FFFFFF</text><text x="350" y="130" class="caption">浮层 / 输入框</text><rect x="0" y="150" width="700" height="32" rx="7" fill="#22364e" stroke="#334962"/><rect x="12" y="159" width="24" height="14" rx="3" fill="#22364e"/><text x="48" y="170" class="token">border-subtle</text><text x="180" y="170" class="value">#334962 / #D4DEE9</text><text x="350" y="170" class="caption">分隔与边框</text></g>
    <g transform="translate(780 50)"><text x="0" y="16" class="caption">品牌冷色 15% · 雪花衍生冰蓝 / 青色</text><rect x="0" y="30" width="700" height="32" rx="7" fill="#a7f3ff"/><text x="18" y="51" class="token dark-text">brand-300</text><text x="180" y="51" class="value dark-text">#A7F3FF</text><text x="350" y="51" class="caption dark-text">深色主图标 / 浅色 focus</text><rect x="0" y="70" width="700" height="32" rx="7" fill="#55d9ee"/><text x="18" y="91" class="token dark-text">brand-500</text><text x="180" y="91" class="value dark-text">#55D9EE</text><text x="350" y="91" class="caption dark-text">主按钮 / hover</text><rect x="0" y="110" width="700" height="32" rx="7" fill="#2bbfd9"/><text x="18" y="131" class="token dark-text">brand-600</text><text x="180" y="131" class="value dark-text">#2BBFD9</text><text x="350" y="131" class="caption dark-text">active / focus ring</text><rect x="0" y="150" width="700" height="32" rx="7" fill="#0d7b99"/><text x="18" y="171" class="token light-text">brand-700</text><text x="180" y="171" class="value light-text">#0D7B99</text><text x="350" y="171" class="caption light-text">浅色按钮 / 深色文本</text></g>
  </g>

  <!-- Dark/light surfaces -->
  <g transform="translate(40 370)"><use href="#panel-dark"/><text x="24" y="32" class="label title">02A  Node · dark</text><text x="24" y="54" class="note">高密度工作台：中性表面承载层级，冰蓝只做交互锚点</text><rect x="24" y="76" width="692" height="42" rx="8" fill="#0b1220"/><text x="42" y="101" class="token">surface-0</text><text x="180" y="101" class="caption">#0B1220</text><rect x="24" y="124" width="692" height="42" rx="8" fill="#111c2d"/><text x="42" y="149" class="token">surface-1</text><text x="180" y="149" class="caption">#111C2D · sidebar</text><rect x="24" y="172" width="692" height="42" rx="8" fill="#16263b"/><text x="42" y="197" class="token">surface-2</text><text x="180" y="197" class="caption">#16263B · card</text><rect x="24" y="224" width="692" height="42" rx="8" fill="#22364e"/><text x="42" y="249" class="token">border-subtle</text><text x="180" y="249" class="caption">#22364E · divider</text><circle cx="648" cy="245" r="8" fill="#55d9ee"/><text x="666" y="249" class="caption">brand-500</text></g>
  <g transform="translate(820 370)"><use href="#panel-light"/><text x="24" y="32" class="dark-text title">02B  Manage · light</text><text x="24" y="54" class="dark-text note">管理台：同一 token 语义提升亮度，保证表格与表单长时间可读</text><rect x="24" y="76" width="692" height="42" rx="8" fill="#f8fafc" stroke="#d4dee9"/><text x="42" y="101" class="dark-text token">surface-0</text><text x="180" y="101" class="dark-text caption">#F8FAFC</text><rect x="24" y="124" width="692" height="42" rx="8" fill="#f1f5f9" stroke="#d4dee9"/><text x="42" y="149" class="dark-text token">surface-1</text><text x="180" y="149" class="dark-text caption">#F1F5F9 · sidebar</text><rect x="24" y="172" width="692" height="42" rx="8" fill="#ffffff" stroke="#d4dee9"/><text x="42" y="197" class="dark-text token">surface-2</text><text x="180" y="197" class="dark-text caption">#FFFFFF · card</text><rect x="24" y="224" width="692" height="42" rx="8" fill="#e8eef5"/><text x="42" y="249" class="dark-text token">border-subtle</text><text x="180" y="249" class="dark-text caption">#D4DEE9 · divider</text><circle cx="648" cy="245" r="8" fill="#0d7b99"/><text x="666" y="249" class="dark-text caption">brand-700</text></g>

  <!-- Interaction states -->
  <g transform="translate(40 690)"><rect width="930" height="300" rx="16" fill="#0b1728" fill-opacity=".78" stroke="#28445f"/><text x="24" y="32" class="label title">03  控件状态</text><text x="194" y="32" class="note">同一个普通 Agent 图标：状态由表面、边框和冷色层级表达</text>
    <g transform="translate(24 58)"><rect width="210" height="190" rx="12" fill="#111c2d" stroke="#2b4059"/><circle cx="105" cy="75" r="32" fill="#16263b" stroke="#2b4059"/><use href="#i-agent" x="93" y="63" width="24" height="24" style="color:#a7bad0"/><text x="105" y="135" text-anchor="middle" class="token">normal</text><text x="105" y="157" text-anchor="middle" class="caption">中性表面 / muted</text></g>
    <g transform="translate(248 58)"><rect width="210" height="190" rx="12" fill="#16263b" stroke="#55d9ee" stroke-width="1.5"/><circle cx="105" cy="75" r="32" fill="#1c3047" stroke="#55d9ee"/><use href="#i-agent" x="93" y="63" width="24" height="24" style="color:#a7f3ff"/><text x="105" y="135" text-anchor="middle" class="token">hover</text><text x="105" y="157" text-anchor="middle" class="caption">brand-500 / raised</text></g>
    <g transform="translate(472 58)"><rect width="210" height="190" rx="12" fill="#1c3047" stroke="#2bbfd9" stroke-width="2"/><circle cx="105" cy="75" r="32" fill="#21415b" stroke="#2bbfd9" stroke-width="2"/><use href="#i-agent" x="93" y="63" width="24" height="24" style="color:#a7f3ff"/><path d="m120 57 4 4 7-8" fill="none" stroke="#55d9ee" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="105" y="135" text-anchor="middle" class="token">active</text><text x="105" y="157" text-anchor="middle" class="caption">brand-600 / focus</text></g>
    <g transform="translate(696 58)"><rect width="210" height="190" rx="12" fill="#111c2d" stroke="#2b4059" opacity=".58"/><circle cx="105" cy="75" r="32" fill="#16263b" opacity=".58"/><use href="#i-agent" x="93" y="63" width="24" height="24" style="color:#556b82;opacity:.58"/><text x="105" y="135" text-anchor="middle" class="token" fill="#71869e">disabled</text><text x="105" y="157" text-anchor="middle" class="caption">对比度下降但仍可辨认</text></g>
  </g>

  <!-- Semantics and third party exception -->
  <g transform="translate(990 690)"><rect width="570" height="300" rx="16" fill="#0b1728" fill-opacity=".78" stroke="#28445f"/><text x="24" y="32" class="label title">04  语义色与品牌例外</text><text x="24" y="54" class="note">5% 强调只表达状态；Agent / 工作组不各自染色</text>
    <g transform="translate(24 70)"><circle cx="14" cy="12" r="9" fill="#35b77a"/><use href="#i-check" x="6" y="4" width="16" height="16" style="color:#06251a"/><text x="36" y="16" class="token">success</text><text x="170" y="16" class="value">#35B77A / #16824F</text></g>
    <g transform="translate(24 106)"><circle cx="14" cy="12" r="9" fill="#d99b2b"/><use href="#i-alert" x="6" y="4" width="16" height="16" style="color:#2c1d00"/><text x="36" y="16" class="token">warning</text><text x="170" y="16" class="value">#D99B2B / #9B6700</text></g>
    <g transform="translate(24 142)"><circle cx="14" cy="12" r="9" fill="#e56369"/><path d="m10 8 8 8M18 8l-8 8" stroke="#3a0d12" stroke-width="1.7" stroke-linecap="round"/><text x="36" y="16" class="token">danger</text><text x="170" y="16" class="value">#E56369 / #B4232F</text></g>
    <g transform="translate(24 178)"><circle cx="14" cy="12" r="9" fill="#3e9bd6"/><use href="#i-info" x="6" y="4" width="16" height="16" style="color:#071a29"/><text x="36" y="16" class="token">info</text><text x="170" y="16" class="value">#3E9BD6 / #176A9A</text></g>
    <g transform="translate(24 214)"><circle cx="14" cy="12" r="9" fill="#6b8daa"/><use href="#i-loading" x="6" y="4" width="16" height="16" style="color:#0d1d2b"/><text x="36" y="16" class="token">pending</text><text x="170" y="16" class="value">#6B8DAA / #466B89</text></g>
    <path d="M340 72v170" stroke="#29445f"/><text x="366" y="89" class="caption">第三方品牌色保留</text><circle cx="374" cy="118" r="7" fill="#4d6bfe"/><text x="392" y="122" class="token">DeepSeek</text><circle cx="374" cy="151" r="7" fill="#10a37f"/><text x="392" y="155" class="token">OpenAI</text><circle cx="374" cy="184" r="7" fill="#16b979"/><text x="392" y="188" class="token">WeCom</text><circle cx="374" cy="217" r="7" fill="#8756d6"/><text x="392" y="221" class="token">Mimo / connector</text><text x="366" y="250" class="small">仅表达外部身份，不参与系统语义状态。</text></g>

  <text x="50" y="1032" class="label title">可访问性检查</text><text x="250" y="1032" class="note">文字与表面同时承担信息，颜色不作为唯一状态信号；深色/浅色 token 均以正文 4.5:1、较大文字 3:1 为目标。</text><text x="50" y="1060" class="small">Auto 仅使用受控 indigo 辅助色（#8A83F5 / #5D59C4），普通 Agent 与工作组保持品牌冷色和中性表面。</text><text x="1548" y="1060" text-anchor="end" class="small">DAgents · color proposal · 2026-09</text>
</svg>
