# 离线 bundle 专用：仅启动已 import 的本地镜像，不含 build。
services:
  manage:
    image: ${MANAGE_IMAGE:-dagents-manage:latest}
    container_name: manage
    ports:
      - "${MANAGE_PORT:-8020}:8020"
    environment:
      MANAGE_HOST: 0.0.0.0
      MANAGE_PORT: 8020
      MANAGE_DB_PATH: /data/manage.db
      MANAGE_RELEASES_DIR: /data/releases
      MANAGE_BLOB_DIR: /data/blobs
      MANAGE_AUDIT_PATH: /data/audit.jsonl
      MANAGE_SEED_BUNDLED_RELEASES: ${MANAGE_SEED_BUNDLED_RELEASES:-1}
      MANAGE_A2A_EXPIRE_SWEEP_SECONDS: ${MANAGE_A2A_EXPIRE_SWEEP_SECONDS:-30}
      MANAGE_BLOB_MAX_BYTES: ${MANAGE_BLOB_MAX_BYTES:-}
      MANAGE_AUDIT_MAX_ENTRIES: ${MANAGE_AUDIT_MAX_ENTRIES:-500}
    volumes:
      - manage-data:/data
    restart: unless-stopped

volumes:
  manage-data:
    name: dagents-manage-data
