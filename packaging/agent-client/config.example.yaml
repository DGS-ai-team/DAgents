# config.example.yaml — Agent Node 与 Client 共用配置（可提交仓库）
#
# 本地使用：
#   cp packaging/agent-client/config.example.yaml packaging/agent-client/config.yaml
#   # 编辑 config.yaml（如 llm.mock: false、agent_id 等）；config.yaml 已在 .gitignore 中
#
# 开发联调也可直接引用本文件（默认 llm.mock=true，无需 API Key）：
#   go run ./node/cmd/dagents-node -config packaging/agent-client/config.example.yaml

agent_id:   # 可选；缺省时自动生成并写入 .runtime/agent/agent_id，建议不填自动生成

listen:
  host: 127.0.0.1
  port: 18765

local:
  endpoint: http://127.0.0.1:18765

expose_to_peers: false

# Manage 发现分组由 Manage Console / API 分配，Node 配置中无需 groups

# 工作区根（工具沙箱 + 运行时子目录均相对此路径硬编码，缺省 ./.runtime）
# 子目录：data/ 临时工作区 · memory/sessions.db 会话库 · skills/ · policy/ · history/ · triggers/ · agent/
fs_root: ./.runtime

llm:
  provider: deepseek   # openai | deepseek | qwen | vllm
  base_url: https://api.deepseek.com   # 留空时按 provider 默认：deepseek→api.deepseek.com · qwen→dashscope compatible-mode/v1 · vllm→127.0.0.1:8000/v1
  model: deepseek-chat   # deepseek 示例：deepseek-reasoner 或 deepseek-chat（Thinking 模式）
  # 思考控制（provider=deepseek|qwen；运行时可由 Client /thinking 或 PATCH /v1/llm/settings 热更新）
  # thinking: enabled      # enabled | disabled；默认 enabled
  # reasoning_effort: high  # thinking=enabled 时：high | max；qwen 映射为 thinking_budget
  # 真实 LLM：设 mock: false，并 export OPENAI_API_KEY（所有 provider 共用；也可改 api_key_env）
  api_key_env: OPENAI_API_KEY
  # --- 其他 provider 示例（取消注释并改 provider；api_key_env 仍用 OPENAI_API_KEY）---
  # provider: qwen
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # model: qwen-plus
  # provider: vllm
  # base_url: http://127.0.0.1:8000/v1
  # model: your-model-name
  mock: false
  max_tool_loops: 32

manage:
  enabled: false
  # url: http://127.0.0.1:8020
  # registration:
  #   base_url: http://192.168.1.10:18765   # 上报 Manage；留空则用 local.endpoint
  #   interval_seconds: 30
  #   ttl_seconds: 60
  #   team: platform
  # Node 注册时自动发送 Header: x-dagents-agent-id = agent_id
  # node_token: 可选，仅 Manage 启用 MANAGE_TOKENS 时需要

# 工具审批策略位于 fs_root/policy/（首次启动从 packaging/runtime/policy 种子复制）
# 编辑 tool.approval.txt 与 shell/*.approval.txt 即可调整审批规则。

skills:
  enabled: true
  max_in_prompt: 5

compression:
  silent_trigger_tokens: 80000
  blocking_trigger_tokens: 100000

triggers:
  enabled: true
  poll_seconds: 5

# 原始消息 JSONL 审计（对齐 Python AGENT_RAW_MESSAGE_HISTORY_ENABLED，默认 true）
# raw_message_history:
#   enabled: true

# Node stderr 日志级别：debug | info | warn | error
log:
  level: info

# bash_run 子进程输出解码（留空则 Windows cmd/powershell=gbk、bash=utf-8）
tools:
  # 内置工具组允许列表；省略或留空 = 启用全部（7 组见 docs/built-in-tools.md §0 / shared/config/README.md）
  # enabled_groups:
  #   - fs
  #   - bash
  #   - hitl
  #   - skills
  #   - triggers
  #   - a2a            # 须 manage.enabled
  #   - child_agents   # 建议配合 child_agents.enabled
  # bash_output_encoding: gbk
  bash_output_encoding: utf-8
  # file_encoding: gbk   # read/write/search_replace/grep 默认磁盘编码；省略时 Windows=gbk，其它=utf-8
  bash_compress:
    enabled: true
    max_output_chars: 12000       # stdout 最大 rune 数
    max_output_chars_stderr: 16000

# 临时子 Agent（见 docs/architecture/child-agent-tools.md）
child_agents:
  enabled: true
  default_ttl_seconds: 1800
  max_ttl_seconds: 7200
  default_max_turns: 20
  max_max_turns: 50
  max_active_per_parent: 8
  default_wait_timeout_seconds: 300

# tool.before_each Hook：rule+auto 路径重复调用检测（见 docs/design/tool-before-hook-duplicate-approval.md）
hooks:
  duplicate_tool_call:
    enabled: true
    window_seconds: 60
