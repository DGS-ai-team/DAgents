# config.example.yaml — Agent Node 配置模板（可提交仓库）
#
# 本地使用：
#   cp packaging/agent-client/config.example.yaml packaging/agent-client/config.yaml
#   # 编辑 config.yaml；config.yaml 已在 .gitignore 中
#
# 开发联调也可直接引用本文件：
#   go run ./node/cmd/dagents-node -config packaging/agent-client/config.example.yaml
#
# 说明：用户 Agent 实例的策略 / 侧车 / LLM 连接以 SQLite 为准（agents.db、llm_configs.db）；
# 本文件主要是 Node 进程级默认值与 Manage 连接。

# node_id：可选；缺省自动生成并写入 <fs_root>/node/node_id
# （旧键 agent_id 仍可读并合并为 node_id，请勿再新增）
node_id:

listen:
  host: 127.0.0.1
  port: 18765

local:
  endpoint: http://127.0.0.1:18765

# Node 对外身份（Manage / A2A）；替代已删除的 agent-card.json
# role=compliance → 可作为被调方（expose_to_peers 由 role 推导，勿再写独立开关）
# role=ops 或留空 → 通常作调用方
agent:
  name: local-assistant
  description: 本机智能助手
  role: ops
  # capabilities: []
  # metadata: {}

# 工作区根（工具沙箱 + 运行时数据，缺省 ./.runtime）
# 主要产物：agents.db · llm_configs.db · node/node_id · data/ · skills/ · externaltools/ · history/ · triggers/
# （policy/、prompt_context/、memory/long_term.md 仅作首次迁移种子，权威数据在 SQLite）
fs_root: ./.runtime

llm:
  # 推荐在 Web UI「设置 › 连接 › LLM 配置」管理；密钥加密存 llm_configs.db。
  # 下方为启动默认值 / 首次迁移快照。
  provider: deepseek   # openai | deepseek | qwen | vllm
  base_url: https://api.deepseek.com
  model: deepseek-chat
  # thinking: enabled      # enabled | disabled；默认 enabled
  # reasoning_effort: high  # high | max（thinking=enabled 时）
  api_key_env: OPENAI_API_KEY   # 首次迁移用；迁移后以 UI 录入为准
  # --- 其他 provider 示例 ---
  # provider: qwen
  # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  # model: qwen-plus
  # provider: vllm
  # base_url: http://127.0.0.1:8000/v1
  # model: your-model-name
  mock: false
  max_tool_loops: 32

manage:
  enabled: false
  # 启用：启动 Manage → manage.enabled: true → 取消下列注释；tools.enabled_groups 含 a2a
  # （见 docs/handbook/05-Manage与A2A.md、packaging/manage/README.md）
  # url: http://127.0.0.1:8020
  # node_token:              # Manage 启用 MANAGE_TOKENS 时填写
  # registration:
  #   base_url: http://192.168.1.10:18765   # 上报可达地址；留空则用 local.endpoint
  #   interval_seconds: 30
  #   ttl_seconds: 60                       # 应大于 interval_seconds
  #   team: platform                        # Manage Console 目录标签
  # a2a:
  #   enabled: true                         # false = 仅注册、不拉 Inbox
  #   inbox_wait_seconds: 25
  #   inbox_poll_seconds: 30                # 省略时默认 = interval_seconds
  # 发现分组由 Manage Console/API 分配，勿在 Node config 写 groups

# 审批策略请在 Web UI「Agents › 策略」配置（SQLite agent_policy）；
# .runtime/policy 仅首次迁移/种子，改文件不会更新已有 Agent。

skills:
  enabled: true
  max_in_prompt: 5

compression:
  silent_trigger_tokens: 80000
  blocking_trigger_tokens: 100000
  # idle_auto_compress_seconds: 3600
  # idle_auto_compress_poll_seconds: 60
  # idle_auto_compress_min_tokens: 80000

triggers:
  enabled: true
  poll_seconds: 5

# raw_message_history:
#   enabled: true

# Node 日志级别：debug | info | warn | error
log:
  level: info

ui:
  enabled: true

tools:
  # 内置工具组；省略 = 全部（见 handbook/04 · shared/config/README.md）
  # 单 Agent 可在创建/设置里覆盖 enabled_groups
  # enabled_groups:
  #   - fs
  #   - bash
  #   - hitl
  #   - skills
  #   - triggers
  #   - a2a            # 须 manage.enabled
  #   - child_agents
  bash_output_encoding: utf-8   # 留空则 Windows cmd/powershell=gbk、bash=utf-8
  # file_encoding: gbk          # FS 默认磁盘编码；省略 utf-8
  bash_compress:
    enabled: true
    max_output_chars: 12000
    max_output_chars_stderr: 16000

child_agents:
  enabled: true
  default_ttl_seconds: 1800
  max_ttl_seconds: 7200
  default_max_turns: 20
  max_max_turns: 50
  max_active_per_parent: 8
  default_wait_timeout_seconds: 300

hooks:
  duplicate_tool_call:
    enabled: true
    window_seconds: 60
  tool_result:
    enabled: true
    spill_threshold_tokens: 12000
    tools:
      - bash_run
      - read_file
      - grep_file
      - grep_files
      - search_replace
      - glob_files
      - agent_invoke
      - agent_discover
  # plugins:
  #   - path: .runtime/plugins/redact.so
  #     phases: [tool.after_each]
  #     priority: 100
  #     on_error: continue
  # host:
  #   max_llm_calls: 2
  #   history_window: 100

