[package]
name = "dagents-shell"
version = "0.11.0"
description = "DAgents Windows Desktop Shell (Tauri tray)"
authors = ["DAgents"]
edition = "2021"

[lib]
name = "dagents_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
percent-encoding = "2"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = { version = "0.24", features = ["handshake"] }
open = "5"
sha2 = "0.10.9"
hex = "0.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winrt-notification = { package = "tauri-winrt-notification", version = "0.8.1" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
